# The marketing site (tryomniscient.com) on Fly.io: Caddy serving this repo (Dockerfile, Caddyfile).
# Deploys on every push to main (.github/workflows/fly-deploy.yml). 256 MB is plenty for static files.
app = "omniscient-site"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
