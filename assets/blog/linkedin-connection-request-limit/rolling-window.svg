<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How the weekly invitation count rolls at Normal pace</title>
<desc id="d">Two weeks of invitations at Normal pace: 12 to 14 on each weekday and none at the weekend. On the second Wednesday, the last seven days hold 66 invitations, under the cap of 80 a week. Each day's invitations stop counting seven days after they go out.</desc>
<rect width="720" height="490" fill="#ffffff"/>
<text x="32" y="48" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Rolling week</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">The weekly count rolls <tspan fill="#171717">at Normal pace</tspan></text>
<rect x="172.6" y="142" width="328.0" height="236" fill="#0c8c5e" fill-opacity="0.08" stroke="#0c8c5e" stroke-width="2" rx="10"/>
<text x="336.6" y="172" text-anchor="middle" font-size="21" font-weight="500" fill="#171717">Last 7 days: 66 of 80</text>
<text x="196.0" y="128" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Week 1</text>
<text x="524.0" y="128" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Week 2</text>
<rect x="41.4" y="227.5" width="28" height="110.5" fill="#d4d4d4" stroke="#ebebeb" rx="6"><title>Mon, week 1: 13 invitations</title></rect>
<text x="55.4" y="219.5" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">13</text>
<text x="55.4" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Mon</text>
<rect x="88.3" y="219.0" width="28" height="119.0" fill="#d4d4d4" stroke="#ebebeb" rx="6"><title>Tue, week 1: 14 invitations</title></rect>
<text x="102.3" y="211.0" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">14</text>
<text x="102.3" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Tue</text>
<rect x="135.1" y="236.0" width="28" height="102.0" fill="#d4d4d4" stroke="#ebebeb" rx="6"><title>Wed, week 1: 12 invitations</title></rect>
<text x="149.1" y="228.0" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">12</text>
<text x="149.1" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Wed</text>
<rect x="182.0" y="219.0" width="28" height="119.0" fill="#0c8c5e" stroke="#ebebeb" rx="6"><title>Thu, week 1: 14 invitations</title></rect>
<text x="196.0" y="211.0" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">14</text>
<text x="196.0" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Thu</text>
<rect x="228.9" y="227.5" width="28" height="110.5" fill="#0c8c5e" stroke="#ebebeb" rx="6"><title>Fri, week 1: 13 invitations</title></rect>
<text x="242.9" y="219.5" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">13</text>
<text x="242.9" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Fri</text>
<text x="289.7" y="330" text-anchor="middle" font-size="22" font-weight="500" fill="#a3a3a3">0</text>
<text x="289.7" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Sat</text>
<text x="336.6" y="330" text-anchor="middle" font-size="22" font-weight="500" fill="#a3a3a3">0</text>
<text x="336.6" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Sun</text>
<rect x="369.4" y="219.0" width="28" height="119.0" fill="#0c8c5e" stroke="#ebebeb" rx="6"><title>Mon, week 2: 14 invitations</title></rect>
<text x="383.4" y="211.0" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">14</text>
<text x="383.4" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Mon</text>
<rect x="416.3" y="236.0" width="28" height="102.0" fill="#0c8c5e" stroke="#ebebeb" rx="6"><title>Tue, week 2: 12 invitations</title></rect>
<text x="430.3" y="228.0" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">12</text>
<text x="430.3" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Tue</text>
<rect x="463.1" y="227.5" width="28" height="110.5" fill="#0c8c5e" stroke="#ebebeb" rx="6"><title>Wed, week 2: 13 invitations</title></rect>
<text x="477.1" y="219.5" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">13</text>
<text x="477.1" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Wed</text>
<rect x="510.0" y="219.0" width="28" height="119.0" fill="#d4d4d4" stroke="#ebebeb" rx="6"><title>Thu, week 2: 14 invitations</title></rect>
<text x="524.0" y="211.0" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">14</text>
<text x="524.0" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Thu</text>
<rect x="556.9" y="236.0" width="28" height="102.0" fill="#d4d4d4" stroke="#ebebeb" rx="6"><title>Fri, week 2: 12 invitations</title></rect>
<text x="570.9" y="228.0" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">12</text>
<text x="570.9" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Fri</text>
<text x="617.7" y="330" text-anchor="middle" font-size="22" font-weight="500" fill="#a3a3a3">0</text>
<text x="617.7" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Sat</text>
<text x="664.6" y="330" text-anchor="middle" font-size="22" font-weight="500" fill="#a3a3a3">0</text>
<text x="664.6" y="364" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Sun</text>
<line x1="32" x2="688" y1="338" y2="338" stroke="#8a8a85"/>
<text x="32" y="420" font-size="21" fill="#171717">Invitations stop counting seven days after they go out.</text>
<text x="32" y="454" font-size="19" fill="#737373">A setting of 15 gives a daily cap of 12 to 14.</text>
</svg>
