<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" width="720" height="490" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How the weekly invitation count rolls at Normal pace</title>
<desc id="d">Two weeks of invitations at Normal pace: 12 to 14 on each weekday and none at the weekend. On the second Wednesday, the last seven days hold 66 invitations, under the cap of 80 a week. Each day's invitations stop counting seven days after they go out.</desc>
<rect width="720" height="490" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="489" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Rolling week]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">The weekly count rolls <tspan fill="#a3a3a3">at Normal pace</tspan></text>
<rect x="172.6" y="142" width="328.0" height="236" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="2"/>
<text x="336.6" y="172" text-anchor="middle" font-size="21" font-weight="600" fill="#0a0a0a">Last 7 days: 66 of 80</text>
<text x="196.0" y="128" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#737373">Week 1</text>
<text x="524.0" y="128" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#737373">Week 2</text>
