<line x1="32" x2="688" y1="338" y2="338" stroke="#0a0a0a"/>
<text x="32" y="420" font-size="21" fill="#0a0a0a">Invitations stop counting seven days after they go out.</text>
<text x="32" y="454" font-size="19" fill="#737373">A setting of 15 gives a daily cap of 12 to 14.</text>
