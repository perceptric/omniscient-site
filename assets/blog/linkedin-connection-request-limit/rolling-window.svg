<text x="102.3" y="364" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">Tue</text>
<rect x="135.1" y="236.0" width="28" height="102.0" fill="#d4d4d4" stroke="#0a0a0a"><title>Wed, week 1: 12 invitations</title></rect>
