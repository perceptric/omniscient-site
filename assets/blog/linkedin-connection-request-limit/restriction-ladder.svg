<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 616" width="720" height="616" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What happens when you hit LinkedIn's invitation limit</title>
<desc id="d">From LinkedIn's help pages: a first invitation restriction lasts a few hours, several in one day last a few days, too many pending invitations can mean up to one month, a suspension for automation ends at the time in LinkedIn's notice, and repeated restrictions can require an email address for every invitation, maybe for good. Most restrictions lift on their own within one week.</desc>
<rect width="720" height="616" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="615" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Restrictions]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">When you hit the limit <tspan fill="#a3a3a3">per LinkedIn</tspan></text>
<rect x="32" y="116" width="656" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="32" y="116" width="52" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="58" y="163.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">1</text>
<text x="102" y="148" font-size="20" fill="#737373">First invitation restriction</text>
<text x="102" y="176" font-size="21" font-weight="600" fill="#0a0a0a">A few hours</text>
<rect x="32" y="194" width="656" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="32" y="194" width="52" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="58" y="241.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">2</text>
<text x="102" y="226" font-size="20" fill="#737373">Several restrictions in one day</text>
<text x="102" y="254" font-size="21" font-weight="600" fill="#0a0a0a">A few days</text>
<rect x="32" y="272" width="656" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="32" y="272" width="52" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="58" y="319.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">3</text>
<text x="102" y="304" font-size="20" fill="#737373">Too many pending invitations</text>
<text x="102" y="332" font-size="21" font-weight="600" fill="#0a0a0a">Up to one month</text>
<rect x="32" y="350" width="656" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="32" y="350" width="52" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="58" y="397.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">4</text>
<text x="102" y="382" font-size="20" fill="#737373">Suspected automation tool</text>
<text x="102" y="410" font-size="21" font-weight="600" fill="#0a0a0a">Until the time in LinkedIn's notice</text>
<rect x="32" y="428" width="656" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="32" y="428" width="52" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="58" y="475.0" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">5</text>
<text x="102" y="460" font-size="20" fill="#737373">Repeated restrictions</text>
<text x="102" y="488" font-size="21" font-weight="600" fill="#0a0a0a">Email address for every invitation, maybe for good</text>
<rect x="32" y="535" width="20" height="20" fill="#10b981" stroke="#0a0a0a"/>
<text x="62" y="552" font-size="20" fill="#0a0a0a">Most restrictions lift on their own within a week.</text>
<text x="32" y="588" font-size="19" fill="#737373">Support can't lift one early, and you can't buy more invitations.</text>
