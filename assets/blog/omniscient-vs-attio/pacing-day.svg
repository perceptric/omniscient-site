<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 536" width="720" height="536" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Two example days of one LinkedIn sender in Omniscient at the Normal pace</title>
<desc id="d">Two example days for a sender whose working hours are set to 9:00 to 17:30. Each mark is one action. On Tuesday the day starts a little after 9:00, ends a little before 17:30 and has a lunch break near 12:40. On Wednesday it starts a little before 9:00, ends a little after 17:30 and the lunch break falls near 13:10. The start and end move by up to 20 minutes, the gaps between actions vary at random, and a profile view comes 1 to 4 hours before the invitation to that person.</desc>
