<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 736" width="720" height="736" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">From proposal to signed contract with Attio and with Omniscient</title>
<desc id="d">Two paths side by side. Attio and other tools: you write the proposal in a doc or deck tool, pass contract versions around by email, send it for signature through an e-signature app, and update the deal in Attio by hand or with a workflow. Omniscient: the Deal Room builds the proposal from the deal, the buyer approves it on the proposal page, you upload the contract and your team approves it, and each signer signs from their own link while Otto reads the key dates for a person to confirm.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#333333"/></marker></defs>
<rect width="720" height="736" fill="#ffffff"/>
<text x="32" y="48" font-size="19" fill="#737373">Proposals</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">From proposal to signed contract</text>
<text x="32" y="140" font-size="18" fill="#404040">Attio and other tools</text>
<rect x="378" y="127" width="14" height="14" fill="#0c8c5e" stroke="#333333" rx="3"/>
<text x="400" y="140" font-size="18" fill="#404040">Omniscient</text>
<g font-size="17" fill="#171717">
<rect x="32" y="160" width="310" height="92" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="50" y="198">Write the proposal in a</text>
<text x="50" y="224">doc or deck tool</text>
<line x1="187" x2="187" y1="252" y2="278" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="32" y="284" width="310" height="92" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="50" y="322">Pass contract versions</text>
<text x="50" y="348">around by email</text>
<line x1="187" x2="187" y1="376" y2="402" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="32" y="408" width="310" height="92" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="50" y="446">Send it for signature</text>
<text x="50" y="472">through an e-signature app</text>
<line x1="187" x2="187" y1="500" y2="526" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="32" y="532" width="310" height="92" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="50" y="570">Update the deal in Attio,</text>
<text x="50" y="596">by hand or with a workflow</text>
<rect x="378" y="160" width="310" height="92" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="396" y="198">The Deal Room builds the</text>
<text x="396" y="224">proposal from the deal</text>
<line x1="533" x2="533" y1="252" y2="278" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="378" y="284" width="310" height="92" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="396" y="322">The buyer approves it</text>
<text x="396" y="348">on the proposal page</text>
<line x1="533" x2="533" y1="376" y2="402" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="378" y="408" width="310" height="92" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="396" y="446">You upload the contract,</text>
<text x="396" y="472">and your team approves it</text>
<line x1="533" x2="533" y1="500" y2="526" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="378" y="532" width="310" height="92" fill="#ffffff" stroke="#0c8c5e" stroke-width="2" rx="10"/>
<text x="396" y="570">Each signer signs from a link,</text>
<text x="396" y="596">and Otto reads the key dates</text>
</g>
<text x="32" y="672" font-size="17" fill="#737373">The Attio path depends on which tools you connect</text>
<text x="32" y="696" font-size="17" fill="#737373">and what their integrations sync.</text>
</svg>
