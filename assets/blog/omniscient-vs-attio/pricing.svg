<text x="76" y="516" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#404040">Omniscient</text>
<text x="52" y="564" font-size="20" font-weight="500" fill="#171717">Free</text>
<text x="668" y="564" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$0</text>
<text x="52" y="590" font-size="18" fill="#737373">For teammates who only view or log data</text>
