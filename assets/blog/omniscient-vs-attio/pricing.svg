<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 868" width="720" height="868" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Attio and Omniscient prices a month, billed yearly</title>
<desc id="d">Prices a month, billed yearly. Attio: Free $0 for up to 3 users; Plus $40 for the workspace and first user, then $35 per user, up to 10 users; Pro $100 with the first user, then $79 per user; Ultra $1,000 with 5 users, then $189 per user. Omniscient, per seat: Free $0 for teammates who only view or log data; Starter $19; Pro $49; Business $99. Omniscient's monthly billing costs 20% more. From attio.com/pricing and tryomniscient.com, November 2026.</desc>
<rect width="720" height="868" fill="#ffffff"/>
<text x="32" y="48" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Pricing</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">A month <tspan fill="#171717">billed yearly</tspan></text>
<rect x="32" y="116" width="656" height="346" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="116" width="656" height="46" fill="#f5f5f5" stroke="#ebebeb"/>
