<text x="52" y="194" font-size="20" font-weight="500" fill="#171717">Free</text>
<text x="668" y="194" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$0</text>
<text x="52" y="220" font-size="18" fill="#737373">Up to 3 users</text>
<line x1="33" x2="687" y1="238" y2="238" stroke="#ebebeb"/>
<text x="52" y="270" font-size="20" font-weight="500" fill="#171717">Plus</text>
<text x="668" y="270" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$40</text>
<text x="52" y="296" font-size="18" fill="#737373">With the first user, then $35 per user, up to 10 users</text>
<line x1="33" x2="687" y1="314" y2="314" stroke="#ebebeb"/>
<text x="52" y="346" font-size="20" font-weight="500" fill="#171717">Pro</text>
<text x="668" y="346" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$100</text>
<text x="52" y="372" font-size="18" fill="#737373">With the first user, then $79 per user</text>
<line x1="33" x2="687" y1="390" y2="390" stroke="#ebebeb"/>
<text x="52" y="420" font-size="20" font-weight="500" fill="#171717">Ultra</text>
<text x="668" y="420" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$1,000</text>
<text x="52" y="446" font-size="18" fill="#737373">With 5 users, then $189 per user</text>
<rect x="32" y="486" width="656" height="318" fill="#ffffff" stroke="#ebebeb"/>
