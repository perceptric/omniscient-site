<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 840" width="720" height="840" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Attio and Omniscient prices per seat a month, billed yearly</title>
<desc id="d">Attio, per user a month billed yearly: Free $0 for up to 3 seats; Plus $35, or $44 billed monthly, up to 10 seats; Pro $79, or $99 billed monthly, with sequences and Call Intelligence; Enterprise custom, billed yearly. Omniscient, per seat a month billed yearly: Free $0 for teammates who only view or log data; Starter $19; Pro $49 with the pipeline board and forecast; Business $99 with the manager view and call coaching. Omniscient's monthly billing costs 20% more. From attio.com/pricing and tryomniscient.com, November 2, 2026.</desc>
