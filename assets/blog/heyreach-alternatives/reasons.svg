<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 668" width="720" height="668" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Why you might leave HeyReach, and where to look</title>
<desc id="d">Five reasons teams leave HeyReach and the alternatives that fit each one: a lower price for one or two senders points to Omniscient, Waalaxy, Kanbox or Linked Helper; email in the same sequence points to Expandi, Skylead, SalesRobot or lemlist; replies on a CRM record points to Omniscient; an agency plan with email built in points to GetSales.io, Skylead Agency or Expandi Agency; a gradual ramp for new accounts points to Omniscient, Expandi or GetSales.io. With 25 or more client accounts, HeyReach&#x27;s Agency plan may still fit best.</desc>
<rect width="720" height="668" fill="#ffffff"/>
<text x="32" y="48" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Where to look</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">Why you're leaving <tspan fill="#171717">and what fits</tspan></text>
<rect x="32" y="116" width="656" height="92" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="116" width="52" height="92" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="58" y="170.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">1</text>
<text x="102" y="152" font-size="20" fill="#737373">You want a lower price for one or two senders</text>
<text x="102" y="184" font-size="21" font-weight="500" fill="#171717">Omniscient, Waalaxy, Kanbox or Linked Helper</text>
<rect x="32" y="208" width="656" height="92" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="208" width="52" height="92" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="58" y="262.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">2</text>
<text x="102" y="244" font-size="20" fill="#737373">You want email in the same sequence</text>
<text x="102" y="276" font-size="21" font-weight="500" fill="#171717">Expandi, Skylead, SalesRobot or lemlist</text>
<rect x="32" y="300" width="656" height="92" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="300" width="52" height="92" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="58" y="354.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">3</text>
<text x="102" y="336" font-size="20" fill="#737373">You want every reply on a CRM record</text>
<text x="102" y="368" font-size="21" font-weight="500" fill="#171717">Omniscient</text>
<rect x="32" y="392" width="656" height="92" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="392" width="52" height="92" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="58" y="446.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">4</text>
<text x="102" y="428" font-size="20" fill="#737373">You want an agency plan with email built in</text>
<text x="102" y="460" font-size="21" font-weight="500" fill="#171717">GetSales.io, Skylead Agency or Expandi Agency</text>
<rect x="32" y="484" width="656" height="92" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="484" width="52" height="92" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="58" y="538.0" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">5</text>
<text x="102" y="520" font-size="20" fill="#737373">You want new accounts to warm up on their own</text>
<text x="102" y="552" font-size="21" font-weight="500" fill="#171717">Omniscient, Expandi or GetSales.io</text>
<rect x="32" y="610" width="20" height="20" fill="#0c8c5e" stroke="#ebebeb" rx="6"/>
<text x="62" y="627" font-size="20" fill="#171717">With 25 or more client accounts, HeyReach may still fit best.</text>
</svg>
