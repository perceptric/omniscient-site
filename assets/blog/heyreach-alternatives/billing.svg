<rect x="0.5" y="0.5" width="719" height="927" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Pricing]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">How each tool bills you <tspan fill="#a3a3a3">today</tspan></text>
