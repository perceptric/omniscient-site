<text x="668" y="788" text-anchor="end" font-size="19" fill="#404040">$999 a month for 25 seats, first year</text>
<line x1="33" x2="687" y1="804" y2="804" stroke="#e5e5e5"/>
<text x="52" y="834" font-size="20" font-weight="600" fill="#0a0a0a">HeyReach Unlimited</text>
<text x="668" y="834" text-anchor="end" font-size="19" fill="#404040">$2,999 a month, up to 300 senders</text>
<text x="32" y="894" font-size="18" fill="#737373">Starting prices from each vendor&#x27;s pricing page, November 2026.</text>
