<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" width="720" height="900" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Extra costs to budget for next to a LinkedIn automation plan</title>
<desc id="d">Costs that can sit next to a LinkedIn automation plan. Sales Navigator Core costs US$119.99 a month or US$1,079.88 a year, and Advanced costs US$159.99 a month or US$1,799.88 a year. HeyReach sends email through Instantly or Smartlead, which bill you on their own. Email finder credits: lemlist $16 a month billed yearly for 2,000, Dripify 1,000 credits for $29. Waalaxy&#x27;s LinkedIn Inbox costs €20 a month as an extra. HeyReach Agency and Unlimited ask for your own proxies, and with Linked Helper you buy proxies and any server yourself. Expandi&#x27;s image and GIF personalization costs extra. A separate CRM, when your outreach tool doesn&#x27;t keep the record. Omniscient keeps the CRM in the same seat.</desc>
<rect width="720" height="900" fill="#ffffff"/>
<text x="32" y="48" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Beyond the plan</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">The rest of the bill<tspan fill="#171717"> to plan for</tspan></text>
<text x="32" y="150" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">LinkedIn</text>
<text x="196" y="150" font-size="19" font-weight="600" fill="#171717">Sales Navigator Core</text>
<text x="196" y="176" font-size="17" fill="#404040">US$119.99 a month, or US$1,079.88 a year</text>
<line x1="32" x2="688" y1="188" y2="188" stroke="#ebebeb"/>
<text x="32" y="222" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">LinkedIn</text>
<text x="196" y="222" font-size="19" font-weight="600" fill="#171717">Sales Navigator Advanced</text>
<text x="196" y="248" font-size="17" fill="#404040">US$159.99 a month, or US$1,799.88 a year</text>
<line x1="32" x2="688" y1="260" y2="260" stroke="#ebebeb"/>
<text x="32" y="294" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Email</text>
<text x="196" y="294" font-size="19" font-weight="600" fill="#171717">A cold email tool</text>
<text x="196" y="320" font-size="17" fill="#404040">HeyReach sends email through Instantly or</text>
<text x="196" y="346" font-size="17" fill="#404040">Smartlead, which bill you on their own</text>
<line x1="32" x2="688" y1="358" y2="358" stroke="#ebebeb"/>
<text x="32" y="392" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Data</text>
<text x="196" y="392" font-size="19" font-weight="600" fill="#171717">Email finder credits</text>
<text x="196" y="418" font-size="17" fill="#404040">lemlist: 2,000 credits for $16 a month, billed yearly</text>
<text x="196" y="444" font-size="17" fill="#404040">Dripify: 1,000 credits for $29</text>
<line x1="32" x2="688" y1="456" y2="456" stroke="#ebebeb"/>
<text x="32" y="490" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Inbox</text>
<text x="196" y="490" font-size="19" font-weight="600" fill="#171717">Waalaxy LinkedIn Inbox</text>
<text x="196" y="516" font-size="17" fill="#404040">€20 a month, as an extra</text>
<line x1="32" x2="688" y1="528" y2="528" stroke="#ebebeb"/>
<text x="32" y="562" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Proxies</text>
<text x="196" y="562" font-size="19" font-weight="600" fill="#171717">Your own proxies</text>
<text x="196" y="588" font-size="17" fill="#404040">HeyReach Agency and Unlimited ask for them</text>
<text x="196" y="614" font-size="17" fill="#404040">Linked Helper: proxies and a server are yours to buy</text>
<line x1="32" x2="688" y1="626" y2="626" stroke="#ebebeb"/>
<text x="32" y="660" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Images</text>
<text x="196" y="660" font-size="19" font-weight="600" fill="#171717">Expandi image and GIF personalization</text>
<text x="196" y="686" font-size="17" fill="#404040">Extra, with no price on the page</text>
<line x1="32" x2="688" y1="698" y2="698" stroke="#ebebeb"/>
<text x="32" y="732" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">CRM</text>
<text x="196" y="732" font-size="19" font-weight="600" fill="#171717">A separate CRM</text>
<text x="196" y="758" font-size="17" fill="#404040">When your outreach tool doesn&#x27;t keep the record</text>
<rect x="32" y="784" width="656" height="58" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
