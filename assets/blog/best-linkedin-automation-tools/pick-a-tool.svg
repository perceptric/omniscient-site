<text x="32" y="46" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Pick a tool</text>
<text x="32" y="86" font-size="30" font-weight="500" fill="#171717">Start from your situation <tspan fill="#171717">then try two</tspan></text>
