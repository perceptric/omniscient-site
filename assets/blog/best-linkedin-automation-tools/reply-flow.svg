<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" width="720" height="590" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What Omniscient does when someone replies on LinkedIn</title>
<desc id="d">Step 1: Saved once. A repeat delivery from LinkedIn is stored one time. Step 2: Outreach stops everywhere. That person's sequence ends in every campaign. Step 3: Otto reads the reply. Interested, Question, Not now, Opt out and more. Step 4: Opt outs stay out. Every campaign and later import skips them. Step 5: The thread lands in the Inbox. Next to the person's CRM record and company. Replies typed in the Inbox go out through the same paced queue.</desc>
<rect width="720" height="590" fill="#ffffff"/>
<text x="32" y="46" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">After a reply</text>
<text x="32" y="86" font-size="30" font-weight="500" fill="#171717">What Omniscient does <tspan fill="#171717">when someone replies</tspan></text>
<rect x="32.5" y="112.5" width="655" height="71" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="112.5" width="71" height="71" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="68" y="154" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#171717">01</text>
<text x="124" y="143" font-size="21" font-weight="500" fill="#171717">Saved once</text>
<text x="124" y="169" font-size="19" fill="#737373">A repeat delivery from LinkedIn is stored one time</text>
<line x1="68" x2="68" y1="184" y2="198" stroke="#8a8a85"/>
<rect x="32.5" y="198.5" width="655" height="71" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="198.5" width="71" height="71" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="68" y="240" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#171717">02</text>
<text x="124" y="229" font-size="21" font-weight="500" fill="#171717">Outreach stops everywhere</text>
<text x="124" y="255" font-size="19" fill="#737373">That person's sequence ends in every campaign</text>
<line x1="68" x2="68" y1="270" y2="284" stroke="#8a8a85"/>
<rect x="32.5" y="284.5" width="655" height="71" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="284.5" width="71" height="71" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="68" y="326" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#171717">03</text>
<text x="124" y="315" font-size="21" font-weight="500" fill="#171717">Otto reads the reply</text>
<text x="124" y="341" font-size="19" fill="#737373">Interested, Question, Not now, Opt out and more</text>
<line x1="68" x2="68" y1="356" y2="370" stroke="#8a8a85"/>
<rect x="32.5" y="370.5" width="655" height="71" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="370.5" width="71" height="71" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="68" y="412" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#171717">04</text>
<text x="124" y="401" font-size="21" font-weight="500" fill="#171717">Opt outs stay out</text>
<text x="124" y="427" font-size="19" fill="#737373">Every campaign and later import skips them</text>
<line x1="68" x2="68" y1="442" y2="456" stroke="#8a8a85"/>
<rect x="32.5" y="456.5" width="655" height="71" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="456.5" width="71" height="71" fill="#0c8c5e" stroke="#ebebeb"/>
<text x="68" y="498" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#171717">05</text>
<text x="124" y="487" font-size="21" font-weight="500" fill="#171717">The thread lands in the Inbox</text>
<text x="124" y="513" font-size="19" fill="#737373">Next to the person's CRM record and company</text>
<text x="32" y="560" font-size="18" fill="#737373">Replies typed in the Inbox go out through the same paced queue.</text>
