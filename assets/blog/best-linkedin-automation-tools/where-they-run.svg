<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 652" width="720" height="652" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Where LinkedIn automation tools run</title>
<desc id="d">Three kinds of LinkedIn automation tool. Cloud tools send from the vendor's servers while your laptop is closed: Omniscient, HeyReach, Expandi, Waalaxy, Dripify, La Growth Machine, Skylead and the Dux-Soup cloud plan. Desktop apps send only while that computer is on: Linked Helper and the Dux-Soup local plan. Browser extensions work through your own browser session: lemlist, whose help center says its Chrome extension is required for LinkedIn automation. LinkedIn bans bots in all three.</desc>
<rect width="720" height="652" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="651" fill="none" stroke="#0a0a0a"/>
<text x="32" y="50" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Where it runs]</text>
<text x="32" y="92" font-size="30" font-weight="600" fill="#0a0a0a">Where each tool runs <tspan fill="#a3a3a3">and when it sends</tspan></text>
