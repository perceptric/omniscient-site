<text x="50" y="224" font-size="19" fill="#0a0a0a">Sends with your</text>
<text x="50" y="248" font-size="19" fill="#0a0a0a">laptop closed</text>
<rect x="284.5" y="151.5" width="12" height="12" fill="#10b981" stroke="#0a0a0a"/>
