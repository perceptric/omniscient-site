<text x="284" y="528" font-size="18" fill="#737373">Its help center says the Chrome extension</text>
<text x="284" y="554" font-size="18" fill="#737373">is required for LinkedIn steps</text>
<text x="32" y="622" font-size="18" fill="#737373">LinkedIn bans bots in all three, so pacing matters everywhere.</text>
