<title id="t">Where each feature starts in Attio and HubSpot Sales Hub</title>
<desc id="d">Which plan each feature starts on. Workflows: Attio Free, HubSpot Sales Hub Starter; AI credits included: Attio Free, HubSpot Sales Hub Starter; Email without vendor branding: Attio Plus, HubSpot Sales Hub Starter; Email sequences: Attio Pro, HubSpot Sales Hub Professional; Meeting recording: Attio Pro (Call Intelligence), HubSpot Sales Hub Starter (Notetaker); LinkedIn steps: Attio through apps, HubSpot Sales Hub Professional; Custom objects: Attio Pro, HubSpot Sales Hub Enterprise. HubSpot&#x27;s LinkedIn steps are task reminders and need a Sales Navigator subscription. From attio.com/pricing, hubspot.com/pricing/sales and hubspot.com/products/crm, November 3, 2026.</desc>
