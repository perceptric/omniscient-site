<title id="t">Where to start looking, by where your deals begin</title>
<desc id="d">Where we&#x27;d start looking, by where most of your deals begin. Forms, ads and email campaigns, meaning inbound leads that marketing brings in: HubSpot, for marketing and sales on one record. Email to people you know, meaning warm leads and a process of your own: Attio, for objects you design and sequences on Pro. LinkedIn conversations, meaning outreach to buyers who fit: Omniscient, for LinkedIn messages you approve.</desc>
