<text x="520" y="184" text-anchor="end" font-size="21" font-weight="500" fill="#171717">$0</text>
<text x="40" y="210" font-size="18" fill="#737373">Up to 3 seats</text>
<line x1="25" x2="535" y1="226" y2="226" stroke="#ebebeb"/>
<text x="40" y="258" font-size="20" font-weight="500" fill="#171717">Plus</text>
<text x="520" y="258" text-anchor="end" font-size="21" font-weight="500" fill="#171717">$35</text>
<text x="40" y="284" font-size="18" fill="#737373">$44 billed monthly, up to 10 seats</text>
<line x1="25" x2="535" y1="300" y2="300" stroke="#ebebeb"/>
<text x="40" y="332" font-size="20" font-weight="500" fill="#171717">Pro</text>
<text x="520" y="332" text-anchor="end" font-size="21" font-weight="500" fill="#171717">$79</text>
<text x="40" y="358" font-size="18" fill="#737373">$99 billed monthly, adds sequences</text>
<text x="40" y="384" font-size="18" fill="#737373">and Call Intelligence</text>
<line x1="25" x2="535" y1="400" y2="400" stroke="#ebebeb"/>
<text x="40" y="432" font-size="20" font-weight="500" fill="#171717">Enterprise</text>
<text x="520" y="432" text-anchor="end" font-size="21" font-weight="500" fill="#171717">Custom</text>
<text x="40" y="458" font-size="18" fill="#737373">Billed yearly</text>
<rect x="24" y="494" width="512" height="392" fill="#ffffff" stroke="#ebebeb"/>
<rect x="24" y="494" width="512" height="44" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="40" y="522" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#404040">HubSpot Sales Hub</text>
<text x="40" y="570" font-size="20" font-weight="500" fill="#171717">Free</text>
<text x="520" y="570" text-anchor="end" font-size="21" font-weight="500" fill="#171717">$0</text>
<text x="40" y="596" font-size="18" fill="#737373">Up to 2 users and 1,000 contacts</text>
<line x1="25" x2="535" y1="612" y2="612" stroke="#ebebeb"/>
<text x="40" y="644" font-size="20" font-weight="500" fill="#171717">Starter</text>
<text x="520" y="644" text-anchor="end" font-size="21" font-weight="500" fill="#171717">From $7</text>
<text x="40" y="670" font-size="18" fill="#737373">$10 billed monthly, new customer prices,</text>
<text x="40" y="696" font-size="18" fill="#737373">listed at $20</text>
<line x1="25" x2="535" y1="712" y2="712" stroke="#ebebeb"/>
<text x="40" y="744" font-size="20" font-weight="500" fill="#171717">Professional</text>
<text x="520" y="744" text-anchor="end" font-size="21" font-weight="500" fill="#171717">From $90</text>
<text x="40" y="770" font-size="18" fill="#737373">$100 billed monthly, yearly commitment,</text>
<text x="40" y="796" font-size="18" fill="#737373">$1,500 onboarding once</text>
<line x1="25" x2="535" y1="812" y2="812" stroke="#ebebeb"/>
<text x="40" y="844" font-size="20" font-weight="500" fill="#171717">Enterprise</text>
