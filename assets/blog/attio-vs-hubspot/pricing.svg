<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 974" width="560" height="974" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Attio and HubSpot Sales Hub prices a month</title>
<desc id="d">Prices a month. Attio, billed yearly: Free $0 for up to 3 users; Plus $40 for the workspace and first user, then $35 per user, up to 10 users; Pro $100 with the first user, then $79 per user, with sequences and Call Intelligence; Ultra $1,000 with 5 users, then $189 per user. HubSpot Sales Hub: Free $0 for up to 2 users and 1,000 contacts; Starter from $20 per seat a month, with lower prices for new customers; Professional $90 to $100 per seat a month by how you pay, plus a $1,500 onboarding fee paid once; Enterprise from $150 per seat a month, plus a $3,500 onboarding fee paid once. Plans as of November 2026.</desc>
<rect width="560" height="974" fill="#ffffff"/>
<text x="24" y="46" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Pricing</text>
<text x="24" y="82" font-size="26" font-weight="500" fill="#171717">Prices a month <tspan fill="#171717">by plan</tspan></text>
