<text x="520" y="184" text-anchor="end" font-size="21" font-weight="500" fill="#171717">$0</text>
<text x="40" y="210" font-size="18" fill="#737373">Up to 3 users</text>
<line x1="25" x2="535" y1="226" y2="226" stroke="#ebebeb"/>
<text x="40" y="258" font-size="20" font-weight="500" fill="#171717">Plus</text>
<text x="520" y="258" text-anchor="end" font-size="21" font-weight="500" fill="#171717">$40</text>
<text x="40" y="284" font-size="18" fill="#737373">With the first user, then $35 per user</text>
<line x1="25" x2="535" y1="300" y2="300" stroke="#ebebeb"/>
<text x="40" y="332" font-size="20" font-weight="500" fill="#171717">Pro</text>
<text x="520" y="332" text-anchor="end" font-size="21" font-weight="500" fill="#171717">$100</text>
<text x="40" y="358" font-size="18" fill="#737373">With the first user, then $79 per user,</text>
<text x="40" y="384" font-size="18" fill="#737373">adds sequences and Call Intelligence</text>
