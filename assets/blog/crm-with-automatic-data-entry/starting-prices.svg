<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" width="720" height="596" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Starting price of the lowest paid seat</title>
<desc id="d">The lowest paid seat a month for nine CRMs with automatic data entry: Omniscient $19 billed yearly, HubSpot from $20, Copper $23 billed yearly, folk $24, Salesforce $25, Salesflare $29 billed yearly, Attio $40 for the workspace and first user billed yearly, Coffee $50 and Lightfield $89 billed monthly. Day AI, Clarify, Affinity and Pipedrive are left out because they price per agent, per workspace, per year, or have no figure here.</desc>
