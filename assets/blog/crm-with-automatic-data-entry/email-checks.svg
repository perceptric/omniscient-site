<polygon points="67,215 72,224 77,215" fill="#0a0a0a"/>
<rect x="32.5" y="224.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="264" font-size="20" fill="#0a0a0a">Bulk mail, like a newsletter?</text>
