<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 952" width="720" height="952" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Which emails become CRM data in Omniscient</title>
<desc id="d">A new email comes in or goes out. Bulk mail like a newsletter is skipped. Mail from a no reply or billing address is skipped. An address or domain on your do not track list is skipped. A personal address like gmail.com is left out. Someone new who wrote to you first is not added. Every other email is filed under the person, company and deal, and Otto reads the thread for facts, each with its quote. Personal addresses and new senders follow your sync settings, shown the way we suggest them, and emails with only your own team on them are skipped too.</desc>
<rect width="720" height="952" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="951" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Which emails reach a record]</text>
<text x="32" y="88" font-size="27" font-weight="600" fill="#0a0a0a">Five checks before an email <tspan fill="#a3a3a3">counts</tspan></text>
<rect x="32.5" y="124.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="164" font-size="20" fill="#0a0a0a">A new email comes in or goes out</text>
