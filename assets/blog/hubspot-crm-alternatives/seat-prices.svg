<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1000" width="560" height="1000" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">First paid seat for a team on each alternative, billed yearly</title>
<desc id="d">Price per seat a month on yearly billing, on each alternative&#x27;s first paid plan for a team, from each vendor&#x27;s pricing page on November 3, 2026: Freshsales Growth $9, monday CRM Basic $12 with a 3 seat minimum, EngageBay Basic $13.79, Zoho CRM Standard $14, Omniscient Starter $19, Copper Basic $23, folk Standard $24, Salesflare Growth $29, Attio Plus $35 and Close Essentials $35. For comparison, HubSpot Sales Hub Professional, the plan with sequences, starts at $90 a seat a month on a yearly commitment, plus a $1,500 onboarding fee. Not shown: Pipedrive, whose pricing page didn&#x27;t load for us; Nutshell, which lists monthly prices from $13; Less Annoying CRM, with one plan at $15 a month; and Close Solo, which is $9 for one user only.</desc>
