<title id="t">First paid plan per seat a month for seven B2B SaaS CRMs</title>
<desc id="d">The first paid plan for a team, per seat a month, from each vendor&#x27;s pricing page in November 2026. Freshsales Growth $9 billed yearly. Omniscient Starter $19 billed yearly. HubSpot Sales Hub Starter $20 list price. Day AI Turbo $24 per agent billed yearly. Salesforce Starter Suite $25 billed monthly or yearly. Attio Plus $35 billed yearly. Close Essentials $35 billed yearly. HubSpot also shows a $7 price for new customers, and Close Solo costs $9 for one user. Pipedrive is left out because its pricing page blocked our reader.</desc>
