<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 958" width="720" height="958" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">First paid plan per seat a month for 11 B2B SaaS CRMs</title>
<desc id="d">The first paid plan for a team, per seat a month, from each vendor&#x27;s pricing page in November 2026. Freshsales Growth $9, billed yearly. Twenty Pro $9, billed yearly. monday CRM Basic $12, billed yearly, for 3 seats or more. Zoho CRM Standard $14, billed yearly. Omniscient Starter $19, billed yearly. HubSpot Sales Hub Starter $20, list price. Day AI Turbo $24, per agent, billed yearly. Salesforce Starter Suite $25, monthly or yearly. Salesflare Growth $29, billed yearly. Attio Plus $35, billed yearly. Close Essentials $35, billed yearly. HubSpot also shows a $7 price for new customers, Close Solo costs $9 for one user, and Clarify is priced by AI work with unlimited seats, free and then $50 a month. Pipedrive is left out because its pricing page blocked our reader.</desc>
