<text x="46.5" y="609.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">5</text>
<text x="84" y="598" font-size="22" font-weight="500" fill="#171717">The thread waits in your Inbox</text>
<text x="84" y="626" font-size="19" fill="#737373">Next to the person&#x27;s CRM record</text>
</svg>
