<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 673" width="600" height="673" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What happens to a LinkedIn reply in Omniscient</title>
<desc id="d">What happens to a LinkedIn reply in Omniscient, in order: 1. the reply is saved once: even if linkedin delivers it twice; 2. outreach stops for that person: no more steps in any campaign; 3. otto reads what the reply means: interested, question, not now, opt out and more; 4. an opt out is suppressed: it holds across campaigns and future imports; 5. the thread waits in your inbox: next to the person&#x27;s crm record.</desc>
<rect width="600" height="673" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="599" height="672" fill="none" stroke="#0a0a0a"/>
<text x="24" y="42" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#737373">[When a lead replies]</text>
<text x="24" y="80" font-size="28" font-weight="600" fill="#0a0a0a">What happens next <tspan fill="#a3a3a3">in Omniscient</tspan></text>
<rect x="24.5" y="106.5" width="551" height="87" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="24.5" y="106.5" width="44" height="87" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="46.5" y="157.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">1</text>
<text x="84" y="146" font-size="22" font-weight="600" fill="#0a0a0a">The reply is saved once</text>
<text x="84" y="174" font-size="19" fill="#737373">Even if LinkedIn delivers it twice</text>
<line x1="46.5" y1="194" x2="46.5" y2="211" stroke="#0a0a0a" stroke-width="1.5"/>
<path d="M40.5 209 L46.5 217 L52.5 209 Z" fill="#0a0a0a"/>
<rect x="24.5" y="219.5" width="551" height="87" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="24.5" y="219.5" width="44" height="87" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="46.5" y="270.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">2</text>
<text x="84" y="259" font-size="22" font-weight="600" fill="#0a0a0a">Outreach stops for that person</text>
<text x="84" y="287" font-size="19" fill="#737373">No more steps in any campaign</text>
<line x1="46.5" y1="307" x2="46.5" y2="324" stroke="#0a0a0a" stroke-width="1.5"/>
<path d="M40.5 322 L46.5 330 L52.5 322 Z" fill="#0a0a0a"/>
<rect x="24.5" y="332.5" width="551" height="87" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="24.5" y="332.5" width="44" height="87" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="46.5" y="383.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">3</text>
<text x="84" y="372" font-size="22" font-weight="600" fill="#0a0a0a">Otto reads what the reply means</text>
<text x="84" y="400" font-size="19" fill="#737373">Interested, question, not now, opt out and more</text>
<line x1="46.5" y1="420" x2="46.5" y2="437" stroke="#0a0a0a" stroke-width="1.5"/>
<path d="M40.5 435 L46.5 443 L52.5 435 Z" fill="#0a0a0a"/>
<rect x="24.5" y="445.5" width="551" height="87" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="24.5" y="445.5" width="44" height="87" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="46.5" y="496.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">4</text>
<text x="84" y="485" font-size="22" font-weight="600" fill="#0a0a0a">An opt out is suppressed</text>
<text x="84" y="513" font-size="19" fill="#737373">It holds across campaigns and future imports</text>
<line x1="46.5" y1="533" x2="46.5" y2="550" stroke="#0a0a0a" stroke-width="1.5"/>
<path d="M40.5 548 L46.5 556 L52.5 548 Z" fill="#0a0a0a"/>
<rect x="24.5" y="558.5" width="551" height="87" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="24.5" y="558.5" width="44" height="87" fill="#10b981" stroke="#0a0a0a"/>
<text x="46.5" y="609.5" text-anchor="middle" font-family="Geist Mono, ui-monospace, monospace" font-size="22" fill="#0a0a0a">5</text>
<text x="84" y="598" font-size="22" font-weight="600" fill="#0a0a0a">The thread waits in your Inbox</text>
<text x="84" y="626" font-size="19" fill="#737373">Next to the person&#x27;s CRM record</text>
