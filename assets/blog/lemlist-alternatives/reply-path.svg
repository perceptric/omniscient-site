<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 673" width="600" height="673" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What happens to a LinkedIn reply in Omniscient</title>
<desc id="d">What happens to a LinkedIn reply in Omniscient, in order. 1. The reply is saved once, even if LinkedIn delivers it twice. 2. Outreach stops for that person, with no more steps in any campaign. 3. Otto reads what the reply means: interested, question, not now, opt out and more. 4. An opt out is suppressed, and it holds across campaigns and future imports. 5. The thread waits in your Inbox, next to the person&#x27;s CRM record.</desc>
<rect width="600" height="673" fill="#ffffff"/>
<text x="24" y="42" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">When a lead replies</text>
<text x="24" y="80" font-size="28" font-weight="500" fill="#171717">What happens next <tspan fill="#171717">in Omniscient</tspan></text>
<rect x="24.5" y="106.5" width="551" height="87" fill="#ffffff" stroke="#ebebeb"/>
<rect x="24.5" y="106.5" width="44" height="87" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="46.5" y="157.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">1</text>
<text x="84" y="146" font-size="22" font-weight="500" fill="#171717">The reply is saved once</text>
<text x="84" y="174" font-size="19" fill="#737373">Even if LinkedIn delivers it twice</text>
<line x1="46.5" y1="194" x2="46.5" y2="211" stroke="#8a8a85" stroke-width="1.5"/>
<path d="M40.5 209 L46.5 217 L52.5 209 Z" fill="#333333"/>
<rect x="24.5" y="219.5" width="551" height="87" fill="#ffffff" stroke="#ebebeb"/>
<rect x="24.5" y="219.5" width="44" height="87" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="46.5" y="270.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">2</text>
<text x="84" y="259" font-size="22" font-weight="500" fill="#171717">Outreach stops for that person</text>
<text x="84" y="287" font-size="19" fill="#737373">No more steps in any campaign</text>
<line x1="46.5" y1="307" x2="46.5" y2="324" stroke="#8a8a85" stroke-width="1.5"/>
<path d="M40.5 322 L46.5 330 L52.5 322 Z" fill="#333333"/>
<rect x="24.5" y="332.5" width="551" height="87" fill="#ffffff" stroke="#ebebeb"/>
<rect x="24.5" y="332.5" width="44" height="87" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="46.5" y="383.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">3</text>
<text x="84" y="372" font-size="22" font-weight="500" fill="#171717">Otto reads what the reply means</text>
<text x="84" y="400" font-size="19" fill="#737373">Interested, question, not now, opt out and more</text>
<line x1="46.5" y1="420" x2="46.5" y2="437" stroke="#8a8a85" stroke-width="1.5"/>
<path d="M40.5 435 L46.5 443 L52.5 435 Z" fill="#333333"/>
<rect x="24.5" y="445.5" width="551" height="87" fill="#ffffff" stroke="#ebebeb"/>
<rect x="24.5" y="445.5" width="44" height="87" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="46.5" y="496.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" fill="#171717">4</text>
<text x="84" y="485" font-size="22" font-weight="500" fill="#171717">An opt out is suppressed</text>
<text x="84" y="513" font-size="19" fill="#737373">It holds across campaigns and future imports</text>
<line x1="46.5" y1="533" x2="46.5" y2="550" stroke="#8a8a85" stroke-width="1.5"/>
<path d="M40.5 548 L46.5 556 L52.5 548 Z" fill="#333333"/>
<rect x="24.5" y="558.5" width="551" height="87" fill="#ffffff" stroke="#ebebeb"/>
