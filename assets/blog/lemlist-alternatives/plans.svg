<text x="48" y="346" font-size="22" font-weight="600" fill="#0a0a0a">$109 per user a month, or $87 billed yearly</text>
<text x="48" y="380" font-size="19" fill="#0a0a0a">LinkedIn profile visits, follows, invitations,</text>
