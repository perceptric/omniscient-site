<text x="48" y="140" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Email]</text>
<text x="48" y="176" font-size="22" font-weight="600" fill="#0a0a0a">$69 a month, or $55 billed yearly</text>
<text x="48" y="210" font-size="19" fill="#525252">50,000 emails a month at that price.</text>
<text x="48" y="241" font-size="19" fill="#525252">No LinkedIn automation.</text>
