<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 675" width="600" height="675" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Where LinkedIn automation starts in lemlist&#x27;s plans</title>
<desc id="d">lemlist&#x27;s three plans and where LinkedIn automation starts. Email: $69 a month, or $55 billed yearly, for 50,000 emails a month, with no LinkedIn automation. Multichannel: $109 per user a month, or $87 billed yearly, with LinkedIn profile visits, follows, invitations, messages, voice messages and InMail, 5 senders per user and a call dialer. Enterprise: custom price, everything in Multichannel plus SSO, custom roles and lemlist inside your CRM. From lemlist&#x27;s pricing page, November 2026.</desc>
<rect width="600" height="675" fill="#ffffff"/>
<text x="24" y="42" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">lemlist plans</text>
<text x="24" y="80" font-size="28" font-weight="500" fill="#171717">Where LinkedIn <tspan fill="#171717">starts</tspan></text>
<rect x="24.5" y="106.5" width="551" height="154" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="48" y="140" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Email</text>
<text x="48" y="176" font-size="22" font-weight="500" fill="#171717">$69 a month, or $55 billed yearly</text>
<text x="48" y="210" font-size="19" fill="#525252">50,000 emails a month at that price.</text>
<text x="48" y="241" font-size="19" fill="#525252">No LinkedIn automation.</text>
<rect x="24.5" y="276.5" width="551" height="179" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<rect x="24.5" y="276.5" width="8" height="179" fill="#0c8c5e" stroke="#ebebeb"/>
<rect x="382.5" y="290.5" width="176" height="28" fill="#e3f4ec" stroke="#086444" rx="6"/>
<text x="470.0" y="310" text-anchor="middle" font-size="16" font-weight="500" fill="#086444">LinkedIn starts here</text>
<text x="48" y="310" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Multichannel</text>
<text x="48" y="346" font-size="22" font-weight="500" fill="#171717">$109 per user a month, or $87 billed yearly</text>
<text x="48" y="380" font-size="19" fill="#171717">LinkedIn profile visits, follows, invitations,</text>
<text x="48" y="405" font-size="19" fill="#171717">messages, voice messages and InMail.</text>
<text x="48" y="436" font-size="19" fill="#525252">5 senders per user and a call dialer.</text>
<rect x="24.5" y="471.5" width="551" height="148" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="48" y="505" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Enterprise</text>
<text x="48" y="541" font-size="22" font-weight="500" fill="#171717">Custom price</text>
<text x="48" y="575" font-size="19" fill="#525252">Everything in Multichannel, plus SSO, custom roles</text>
<text x="48" y="600" font-size="19" fill="#525252">and lemlist inside your CRM.</text>
