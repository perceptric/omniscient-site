<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 792" width="720" height="792" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Most invitations one LinkedIn account can send in a day, Waalaxy&#x27;s plans next to Omniscient&#x27;s paces</title>
<desc id="d">Waalaxy Pro: 11 invitations a day, about 300 a month. Waalaxy Advanced and Business: up to 100 a day, at most 200 a week. Omniscient at the Careful pace: 10 a day and 60 a week. At the Normal pace, the default: 15 a day and 80 a week. At the Fast pace: 25 a day and 150 a week. Omniscient&#x27;s highest setting: 40 a day and 200 a week. Sources: Waalaxy&#x27;s help center and Omniscient&#x27;s sender settings. LinkedIn publishes no number.</desc>
<rect width="720" height="792" fill="#ffffff"/>
<text x="32" y="50" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#737373">Invitation ceilings</text>
<text x="32" y="94" font-size="31" font-weight="500" fill="#171717">Most invitations in one day <tspan fill="#171717">per account</tspan></text>
<text x="32" y="150" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Waalaxy</text>
<line x1="32" y1="164" x2="688" y2="164" stroke="#ebebeb"/>
<text x="32" y="204" font-size="24" font-weight="500" fill="#171717">Pro <tspan font-weight="400" fill="#737373">about 300 a month</tspan></text>
<rect x="32.5" y="218.5" width="59.4" height="30" fill="#e5e5e5" stroke="#ebebeb" rx="10"/>
<text x="103" y="241" font-size="22" font-weight="500" fill="#171717">11 a day</text>
<text x="32" y="288" font-size="24" font-weight="500" fill="#171717">Advanced and Business <tspan font-weight="400" fill="#737373">at most 200 a week</tspan></text>
<rect x="32.5" y="302.5" width="540.0" height="30" fill="#e5e5e5" stroke="#ebebeb" rx="10"/>
<text x="584" y="325" font-size="22" font-weight="500" fill="#171717">100 a day</text>
<text x="32" y="372" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Omniscient</text>
<line x1="32" y1="386" x2="688" y2="386" stroke="#ebebeb"/>
<text x="32" y="426" font-size="24" font-weight="500" fill="#171717">Careful <tspan font-weight="400" fill="#737373">60 a week</tspan></text>
<rect x="32.5" y="440.5" width="54.0" height="30" fill="#333333" stroke="#ebebeb" rx="10"/>
<text x="98" y="463" font-size="22" font-weight="500" fill="#171717">10 a day</text>
<text x="32" y="510" font-size="24" font-weight="500" fill="#171717">Normal, the default <tspan font-weight="400" fill="#737373">80 a week</tspan></text>
<rect x="32.5" y="524.5" width="81.0" height="30" fill="#0c8c5e" stroke="#ebebeb" rx="10"/>
<text x="125" y="547" font-size="22" font-weight="500" fill="#171717">15 a day</text>
<text x="32" y="594" font-size="24" font-weight="500" fill="#171717">Fast <tspan font-weight="400" fill="#737373">150 a week</tspan></text>
<rect x="32.5" y="608.5" width="135.0" height="30" fill="#333333" stroke="#ebebeb" rx="10"/>
<text x="179" y="631" font-size="22" font-weight="500" fill="#171717">25 a day</text>
<text x="32" y="678" font-size="24" font-weight="500" fill="#171717">Highest setting <tspan font-weight="400" fill="#737373">200 a week</tspan></text>
<rect x="32.5" y="692.5" width="216.0" height="30" fill="#333333" stroke="#ebebeb" rx="10"/>
<text x="260" y="715" font-size="22" font-weight="500" fill="#171717">40 a day</text>
<text x="32" y="766" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">LinkedIn publishes no number of its own</text>
</svg>
