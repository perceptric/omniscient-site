<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 660" width="720" height="660" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Startup discounts step down each year</title>
<desc id="d">HubSpot for Startups takes 90% off in year one, 50% in year two and 25% in year three, then list price from year four, for new Professional or Enterprise products and startups that have raised up to a Series A. Attio for Startups takes 80% off the yearly Pro plan and credits in year one and 30% in year two, then list price from year three, for venture backed workspaces of up to 10 seats.</desc>
