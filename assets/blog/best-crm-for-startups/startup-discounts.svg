<rect x="128.5" y="526.5" width="150" height="31" fill="#10b981" stroke="#0a0a0a"/>
<rect x="128.5" y="570.5" width="2" height="31" fill="#0a0a0a"/>
<g font-size="19" font-weight="600" fill="#0a0a0a">
<text x="542" y="505">80% off</text>
<text x="292" y="549">30% off</text>
</g>
<text x="144" y="593" font-size="19" fill="#737373">List price</text>
<text x="32" y="636" font-size="17" fill="#737373">Sources: hubspot.com/startups/about and attio.com/startups</text>
<text x="32" y="662" font-size="17" fill="#737373">HubSpot's FAQ says its discount typically lasts two years.</text>
