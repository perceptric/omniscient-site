<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Startup discounts from HubSpot and Attio</title>
<desc id="d">HubSpot for Startups gives Seed and Series A founders 90% off the first year, plus discounts on AI credits as they grow. Attio for Startups gives venture-backed startups with up to 10 users 80% off the yearly Pro plan and credits in the first year, and 30% off the second year. From hubspot.com/startups and attio.com/startups, November 2026.</desc>
<rect width="720" height="470" fill="#ffffff"/>
<text x="32" y="48" font-size="19" fill="#737373">Startup programs</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">Discount by year</text>
<text x="32" y="148" font-size="20" font-weight="500" fill="#171717">HubSpot for Startups</text>
<text x="32" y="174" font-size="17" fill="#737373">Seed and Series A founders</text>
<rect x="300" y="128" width="346" height="32" rx="6" fill="#333333"/>
<text x="314" y="150" font-size="18" font-weight="500" fill="#ffffff">Year 1: 90% off</text>
<line x1="32" x2="688" y1="210" y2="210" stroke="#ebebeb"/>
<text x="32" y="258" font-size="20" font-weight="500" fill="#171717">Attio for Startups</text>
<text x="32" y="284" font-size="17" fill="#737373">Up to 10 users, yearly Pro</text>
<rect x="300" y="238" width="308" height="32" rx="6" fill="#333333"/>
<text x="314" y="260" font-size="18" font-weight="500" fill="#ffffff">Year 1: 80% off</text>
<rect x="300" y="282" width="115" height="32" rx="6" fill="#333333"/>
<text x="425" y="304" font-size="18" font-weight="500" fill="#171717">Year 2: 30% off</text>
<line x1="32" x2="688" y1="350" y2="350" stroke="#ebebeb"/>
<text x="32" y="400" font-size="18" fill="#737373">Bar length shows the share taken off the list price.</text>
<text x="32" y="440" font-size="18" fill="#737373">From hubspot.com/startups and attio.com/startups, November 2026.</text>
</svg>
