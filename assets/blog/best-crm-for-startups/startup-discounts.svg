<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Startup discounts step down each year</title>
<desc id="d">HubSpot for Startups takes 90% off in year one, 50% in year two and 25% in year three, then list price from year four, for startups that have raised up to a Series A and commit to a year. Attio for Startups takes 80% off the yearly Pro plan and credits in year one and 30% in year two, then list price from year three, for workspaces of up to 10 seats. HubSpot's FAQ says its discount typically lasts two years.</desc>
<rect width="720" height="690" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="689" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Startup discounts]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">Discounts step down <tspan fill="#a3a3a3">each year</tspan></text>
<text x="32" y="144" font-size="22" font-weight="600" fill="#0a0a0a">HubSpot for Startups</text>
<text x="32" y="172" font-size="19" fill="#737373">Raised up to a Series A, with a yearly commitment</text>
<g font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#0a0a0a">
<text x="32" y="215">Year 1</text>
<text x="32" y="259">Year 2</text>
<text x="32" y="303">Year 3</text>
<text x="32" y="347">Year 4</text>
</g>
