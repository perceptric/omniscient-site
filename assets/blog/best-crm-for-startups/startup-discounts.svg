<rect x="128.5" y="236.5" width="250" height="31" fill="#10b981" stroke="#0a0a0a"/>
<rect x="128.5" y="280.5" width="125" height="31" fill="#10b981" stroke="#0a0a0a"/>
<rect x="128.5" y="324.5" width="2" height="31" fill="#0a0a0a"/>
<g font-size="19" font-weight="600" fill="#0a0a0a">
<text x="592" y="215">90% off</text>
<text x="392" y="259">50% off</text>
<text x="267" y="303">25% off</text>
</g>
<text x="144" y="347" font-size="19" fill="#737373">List price</text>
<line x1="32" y1="388.5" x2="688" y2="388.5" stroke="#e5e5e5"/>
<text x="32" y="434" font-size="22" font-weight="600" fill="#0a0a0a">Attio for Startups</text>
<text x="32" y="462" font-size="19" fill="#737373">Yearly Pro plan and credits, workspaces up to 10 seats</text>
<g font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#0a0a0a">
<text x="32" y="505">Year 1</text>
<text x="32" y="549">Year 2</text>
<text x="32" y="593">Year 3</text>
</g>
