<rect x="0.5" y="0.5" width="719" height="659" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Startup discounts]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">Discounts step down <tspan fill="#a3a3a3">each year</tspan></text>
<text x="32" y="144" font-size="22" font-weight="600" fill="#0a0a0a">HubSpot for Startups</text>
<text x="32" y="172" font-size="19" fill="#737373">Professional or Enterprise, raised up to a Series A</text>
