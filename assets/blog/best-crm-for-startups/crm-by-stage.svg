<text x="48" y="291" font-size="21" font-weight="600" fill="#0a0a0a">First</text>
<text x="48" y="317" font-size="21" font-weight="600" fill="#0a0a0a">sales hire</text>
<text x="248" y="275" font-size="21" font-weight="600" fill="#0a0a0a">A pipeline learned in a day</text>
<text x="248" y="307" font-size="19" fill="#737373">Pipedrive, Close, Salesflare, Omniscient</text>

<rect x="32.5" y="346.5" width="199" height="99" fill="#f5f5f5" stroke="#0a0a0a"/>
