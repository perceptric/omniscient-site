<rect x="231.5" y="124.5" width="456" height="99" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="152" font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#0a0a0a">01</text>
<text x="48" y="180" font-size="21" font-weight="600" fill="#0a0a0a">Founder</text>
<text x="48" y="206" font-size="21" font-weight="600" fill="#0a0a0a">selling alone</text>
<text x="248" y="164" font-size="21" font-weight="600" fill="#0a0a0a">Capture without typing</text>
<text x="248" y="196" font-size="19" fill="#737373">Omniscient, folk, Streak, HubSpot free CRM</text>

<rect x="32.5" y="235.5" width="199" height="99" fill="#f5f5f5" stroke="#0a0a0a"/>
<rect x="231.5" y="235.5" width="456" height="99" fill="#ffffff" stroke="#0a0a0a"/>
