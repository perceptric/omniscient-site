<text x="48" y="374" font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#0a0a0a">03</text>
<text x="48" y="402" font-size="21" font-weight="600" fill="#0a0a0a">A small</text>
<text x="48" y="428" font-size="21" font-weight="600" fill="#0a0a0a">sales team</text>
<text x="248" y="386" font-size="21" font-weight="600" fill="#0a0a0a">A forecast and access rules</text>
<text x="248" y="418" font-size="19" fill="#737373">HubSpot, Attio, Zoho CRM, monday CRM</text>

<rect x="32.5" y="457.5" width="199" height="99" fill="#f5f5f5" stroke="#0a0a0a"/>
