<text x="32" y="474" font-size="17" fill="#737373">Simplified from the order Omniscient's importer runs for HubSpot,</text>
<text x="32" y="498" font-size="17" fill="#737373">Salesforce, Pipedrive and Attio. Free addresses like Gmail don't count.</text>
