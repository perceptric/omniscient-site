<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" width="720" height="520" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">The order a CRM import runs in</title>
<desc id="d">Six steps in order. 1, companies, matched by web domain. 2, people, linked to their company. 3, companies with no website get one from their people's work email addresses, with free addresses like Gmail left out. 4, pipelines, with stages copied and won and lost mapped. 5, deals, placed on the matching stage. 6, notes, kept on the record they belong to. Simplified from the order Omniscient's importer runs for HubSpot, Salesforce, Pipedrive and Attio.</desc>
<rect width="720" height="520" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="519" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Migration]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">The order an import runs in <tspan fill="#a3a3a3">and why</tspan></text>
<rect x="32.5" y="124.5" width="199" height="127" fill="#10b981" stroke="#0a0a0a"/>
<text x="48" y="154" font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#0a0a0a">01</text>
<text x="48" y="184" font-size="20" font-weight="600" fill="#0a0a0a">Companies</text>
<text x="48" y="212" font-size="16" fill="#0a0a0a">Matched by</text>
<text x="48" y="234" font-size="16" fill="#0a0a0a">web domain</text>
