<path d="M248 183.0L255 188.0L248 193.0" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
<rect x="260.5" y="124.5" width="199" height="127" fill="#ffffff" stroke="#0a0a0a"/>
<text x="276" y="154" font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#0a0a0a">02</text>
<text x="276" y="184" font-size="20" font-weight="600" fill="#0a0a0a">People</text>
<text x="276" y="212" font-size="16" fill="#737373">Linked to their</text>
<text x="276" y="234" font-size="16" fill="#737373">company</text>
<path d="M464 188.0H482" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
<path d="M476 183.0L483 188.0L476 193.0" stroke="#0a0a0a" stroke-width="1.5" fill="none"/>
<rect x="488.5" y="124.5" width="199" height="127" fill="#ffffff" stroke="#0a0a0a"/>
<text x="504" y="154" font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#0a0a0a">03</text>
<text x="504" y="184" font-size="20" font-weight="600" fill="#0a0a0a">Missing websites</text>
<text x="504" y="212" font-size="16" fill="#737373">Filled from their</text>
<text x="504" y="234" font-size="16" fill="#737373">people's work emails</text>
<rect x="32.5" y="300.5" width="199" height="127" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="330" font-family="Geist Mono, ui-monospace, monospace" font-size="16" fill="#0a0a0a">04</text>
<text x="48" y="360" font-size="20" font-weight="600" fill="#0a0a0a">Pipelines</text>
<text x="48" y="388" font-size="16" fill="#737373">Stages copied, with</text>
<text x="48" y="410" font-size="16" fill="#737373">won and lost mapped</text>
