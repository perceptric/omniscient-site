<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" width="560" height="520" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How a newly connected client account warms up in Omniscient</title>
<desc id="d">Invitations a day for a newly connected LinkedIn account at the Normal pace of 15 a day and 80 a week. The day's ceiling starts at 5 and rises by 2 a day: day 1 up to 5, day 2 up to 7, day 3 up to 9, day 4 up to 11, day 5 up to 13, day 6 up to 15, then 15 a day. Each day's cap is drawn between 80% and 100% of that ceiling. A reconnected account warms up again, and the weekly cap is a hard stop.</desc>
<rect width="560" height="520" fill="#ffffff"/>
<text x="20" y="40" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Warmup</text>
<text x="20" y="76" font-size="26" font-weight="500" fill="#171717">A new client account <tspan fill="#171717">starts slow</tspan></text>
<text x="20" y="106" font-size="16" fill="#404040">Invitations a day at the Normal pace (15 a day)</text>
<rect x="20.5" y="124.5" width="14" height="14" fill="#0c8c5e" stroke="#333333" rx="3"/>
<text x="42" y="137" font-size="15" fill="#404040">Where each day's cap lands: 80% to 100% of the ceiling</text>
<line x1="56" x2="540" y1="410.5" y2="410.5" stroke="#8a8a85"/>
<text x="46" y="415.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#737373">0</text>
<line x1="56" x2="540" y1="337.2" y2="337.2" stroke="#ebebeb"/>
<text x="46" y="341.7" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#737373">5</text>
<line x1="56" x2="540" y1="263.8" y2="263.8" stroke="#ebebeb"/>
<text x="46" y="268.3" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#737373">10</text>
<line x1="56" x2="540" y1="190.5" y2="190.5" stroke="#ebebeb"/>
<text x="46" y="195.0" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#737373">15</text>
<rect x="67.8" y="351.8" width="37" height="57.7" fill="#ebebeb" stroke="#ebebeb" rx="10"/>
<rect x="67.8" y="337.2" width="37" height="14.7" fill="#0c8c5e" stroke="#ebebeb"/>
<text x="86.2" y="327.7" text-anchor="middle" font-size="17" font-weight="600" fill="#171717">5</text>
