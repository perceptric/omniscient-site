<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 760" width="600" height="760" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Where LinkedIn and email start in Waalaxy&#x27;s and lemlist&#x27;s plans</title>
<desc id="d">Prices a month on yearly billing. Waalaxy Pro, 19 euros per user: LinkedIn yes, email no, about 300 invitations a month. Waalaxy Advanced, 49 euros per user: LinkedIn yes, email no, 800 invitations a month and the API. Waalaxy Business, 69 euros per user: LinkedIn and cold email sequences, where both channels start. lemlist Email, 55 dollars for the whole team: email only, 50,000 emails a month with unlimited users, no LinkedIn automation. lemlist Multichannel, 87 dollars per user: LinkedIn and email, plus calls, SMS and 5 senders per user, where both channels start. From each vendor&#x27;s pricing page, November 2026.</desc>
