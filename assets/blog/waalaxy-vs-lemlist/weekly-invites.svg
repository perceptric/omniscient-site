<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">The most LinkedIn invitations in one week for one account, by each vendor&#x27;s own numbers</title>
<desc id="d">lemlist&#x27;s help center: about 100 invitations a rolling week, which it gives as LinkedIn&#x27;s cap, and up to 20 a day on working days. Waalaxy Advanced and Business: at most 200 a week, 80 to 100 a day, from Waalaxy&#x27;s help center. Omniscient at the Normal pace, the default: 80 a week and 15 a day. Omniscient&#x27;s highest setting: 200 a week and 40 a day. LinkedIn publishes no number of its own.</desc>
<rect width="720" height="640" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="639" fill="none" stroke="#0a0a0a"/>
<text x="32" y="50" font-family="Geist Mono, ui-monospace, monospace" font-size="20" fill="#737373">[Invitations a week]</text>
<text x="32" y="94" font-size="31" font-weight="600" fill="#0a0a0a">Most invitations in one week <tspan fill="#a3a3a3">per account</tspan></text>
<text x="32" y="150" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[From each help center]</text>
<line x1="32" y1="164" x2="688" y2="164" stroke="#e5e5e5"/>
<text x="32" y="204" font-size="24" font-weight="600" fill="#0a0a0a">lemlist <tspan font-weight="400" fill="#737373">up to 20 a day, working days</tspan></text>
<rect x="32.5" y="218.5" width="270.0" height="30" fill="#e5e5e5" stroke="#0a0a0a"/>
<text x="314" y="241" font-size="22" font-weight="600" fill="#0a0a0a">about 100</text>
<text x="32" y="288" font-size="24" font-weight="600" fill="#0a0a0a">Waalaxy Advanced, Business <tspan font-weight="400" fill="#737373">80 to 100 a day</tspan></text>
<rect x="32.5" y="302.5" width="540.0" height="30" fill="#e5e5e5" stroke="#0a0a0a"/>
<text x="584" y="325" font-size="22" font-weight="600" fill="#0a0a0a">200</text>
<text x="32" y="372" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[From our sender settings]</text>
<line x1="32" y1="386" x2="688" y2="386" stroke="#e5e5e5"/>
<text x="32" y="426" font-size="24" font-weight="600" fill="#0a0a0a">Omniscient, Normal pace <tspan font-weight="400" fill="#737373">15 a day</tspan></text>
<rect x="32.5" y="440.5" width="216.0" height="30" fill="#10b981" stroke="#0a0a0a"/>
<text x="260" y="463" font-size="22" font-weight="600" fill="#0a0a0a">80</text>
<text x="32" y="510" font-size="24" font-weight="600" fill="#0a0a0a">Omniscient, highest setting <tspan font-weight="400" fill="#737373">40 a day</tspan></text>
<rect x="32.5" y="524.5" width="540.0" height="30" fill="#0a0a0a" stroke="#0a0a0a"/>
<text x="584" y="547" font-size="22" font-weight="600" fill="#0a0a0a">200</text>
<text x="32" y="612" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[LinkedIn publishes no number of its own]</text>
</svg>
