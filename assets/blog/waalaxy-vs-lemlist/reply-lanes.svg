<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1056" width="600" height="1056" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Where a LinkedIn reply lands in Waalaxy, lemlist and Omniscient</title>
<desc id="d">Waalaxy: 1. the Waalaxy Inbox, an optional extra at 20 euros a month. 2. CRM sync with HubSpot, Pipedrive, Make, Zapier or n8n. 3. Your CRM, a separate app with its own login. lemlist: 1. a unified inbox with replies from every channel. 2. The HubSpot, Salesforce, Pipedrive or Attio integration. 3. Your CRM, a separate app with its own login. Omniscient: 1. outreach stops for that person in every campaign. 2. Otto reads what the reply means: interested, question, not now or opt out. 3. The thread waits in the Inbox next to the person&#x27;s CRM record, in the same app. From each vendor&#x27;s pages and Omniscient&#x27;s Inbox, November 2026.</desc>
