<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 774" width="560" height="774" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What folk Premium adds over Standard</title>
<desc id="d">folk&#x27;s Standard plan costs $24 and Premium $48 per member a month, billed yearly. Email sequences, custom objects and deals, dashboards and API access are on Premium only. Monthly limits on Standard and Premium: find emails 500 and 1,000; magic fields 2,000 and 5,000; Workflow Assistant 1,500 and 10,000; messages per member 2,000 and 5,000; synced accounts per member 1 and 5; interactions shared with teammates, the last 30 on Standard and the full history on Premium. From folk&#x27;s pricing page, November 3, 2026.</desc>
