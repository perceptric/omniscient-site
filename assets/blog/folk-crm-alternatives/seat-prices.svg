<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 924" width="560" height="924" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Price per seat a month, billed yearly: the lowest paid plan and the first plan with email sequences</title>
<desc id="d">Price per seat a month on yearly billing, from each vendor&#x27;s pricing page on November 3, 2026. folk: Standard $24, email sequences on Premium at $48. Omniscient: Starter $19, no email sequences. Attio: Plus $35, sequences on Pro at $79. Salesflare: Growth $29, email workflows on Pro at $49. Copper: Basic $23, email series on Business at $99. Nimble: one plan at $24.90, sequences not listed on the plan. Dex: Premium $12, no sequences listed. Not shown: HubSpot, whose Starter plan shows two prices without labeling the billing, and Pipedrive, whose pricing page we couldn&#x27;t read.</desc>
