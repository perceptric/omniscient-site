<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1188" width="560" height="1188" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Price per seat a month, billed yearly: the lowest paid plan and the first plan with email sequences</title>
<desc id="d">Price per seat a month on yearly billing. folk: Standard $24, email sequences on Premium at $48. Omniscient: Starter $19, with email sequences as Automation workflows. Attio: Plus $35, sequences on Pro at $79. Salesflare: Growth $29, email workflows on Pro at $49. Copper: Basic $23, email series on Business at $99. Streak: Pro $49, with mail merge and automatic follow ups. Twenty: Pro $9, with workflows on every plan. Nimble: one plan at $24.90, with email sequences included. Dex: Premium $12, mail merge on Professional at $20. Close: Solo $9 for one user, workflows on Growth at $99. Not shown: HubSpot, Pipedrive, Breakcold and Clarify.</desc>
