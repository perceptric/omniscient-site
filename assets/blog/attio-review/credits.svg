<title id="t">Attio workspace credits a month by plan</title>
<desc id="d">Attio workspace credits a month, shared by the team: Free 250, Plus 1,500, Pro 10,000, Ultra 20,000. Each user also gets Ask Attio credits a month: 100 on Free, 500 on Plus, 1,000 on Pro and 2,500 on Ultra. Extra workspace credits start at 5,000 for $70 a month billed yearly. From attio.com/pricing, November 2026.</desc>
