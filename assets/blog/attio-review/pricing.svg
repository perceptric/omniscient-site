<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Attio plans and prices a month, billed yearly</title>
<desc id="d">Attio plans, billed yearly: Free $0 for up to 3 users; Plus $40 a month for the workspace with the first user, then $35 for each added user, up to 10 users, or $50 and $44 billed monthly; Pro $100 a month with the first user, then $79 for each added user, or $125 and $99 billed monthly, adding sequences, Call Intelligence and custom objects; Ultra $1,000 a month with 5 users, then $189 for each added user, billed yearly. From attio.com/pricing, November 2026.</desc>
<rect width="720" height="560" fill="#ffffff"/>
<text x="32" y="48" font-size="19" fill="#737373">Attio pricing</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">A month, billed yearly</text>
<rect x="32" y="116" width="656" height="394" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="116" width="656" height="46" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="52" y="146" font-size="18" fill="#404040">Plan</text>
<text x="668" y="146" text-anchor="end" font-size="18" fill="#404040">Workspace, with first user</text>
<text x="52" y="198" font-size="20" font-weight="500" fill="#171717">Free</text>
<text x="668" y="198" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$0</text>
<text x="52" y="224" font-size="18" fill="#737373">Up to 3 users</text>
<line x1="33" x2="687" y1="244" y2="244" stroke="#ebebeb"/>
<text x="52" y="278" font-size="20" font-weight="500" fill="#171717">Plus</text>
<text x="668" y="278" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$40</text>
<text x="52" y="304" font-size="18" fill="#737373">Then $35 per added user, up to 10 users</text>
<line x1="33" x2="687" y1="324" y2="324" stroke="#ebebeb"/>
<text x="52" y="358" font-size="20" font-weight="500" fill="#171717">Pro</text>
<text x="668" y="358" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$100</text>
<text x="52" y="384" font-size="18" fill="#737373">Then $79 per added user, adds sequences and calls</text>
<line x1="33" x2="687" y1="404" y2="404" stroke="#ebebeb"/>
<text x="52" y="438" font-size="20" font-weight="500" fill="#171717">Ultra</text>
<text x="668" y="438" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$1,000</text>
<text x="52" y="464" font-size="18" fill="#737373">With 5 users, then $189 per added user</text>
<text x="52" y="490" font-size="18" fill="#737373">Billed yearly</text>
<text x="32" y="540" font-size="18" fill="#737373">Monthly billing costs about 25% more on Plus and Pro.</text>
</svg>
