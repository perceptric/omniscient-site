<title id="t">An example sending day for one LinkedIn sender</title>
<desc id="d">Sending runs inside working hours in the sender's time zone. The start and end move by up to 20 minutes each day, a 30 to 60 minute lunch break falls near the middle, actions are spaced 3 to 12 minutes apart at Normal pace, and a profile view comes 1 to 4 hours before the invitation.</desc>
