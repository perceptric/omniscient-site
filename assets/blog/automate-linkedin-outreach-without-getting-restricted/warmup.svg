<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Warmup: invitations allowed per day at Normal pace</title>
<desc id="d">A new LinkedIn sender may send 5 invitations on day 1, then 2 more each day: 5, 7, 9, 11 and 13, reaching the full limit of 15 on day 6 and staying there.</desc>
<rect width="720" height="500" fill="#ffffff"/>
<text x="32" y="46" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Warmup</text>
<text x="32" y="82" font-size="26" font-weight="500" fill="#171717">Invitations allowed per day <tspan fill="#171717">at Normal pace</tspan></text>
<line x1="84" x2="688" y1="301.9" y2="301.9" stroke="#ebebeb"/>
<text x="72" y="307.9" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">5</text>
<line x1="84" x2="688" y1="223.8" y2="223.8" stroke="#ebebeb"/>
<text x="72" y="229.8" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">10</text>
<line x1="84" x2="688" y1="145.6" y2="145.6" stroke="#ebebeb"/>
<text x="72" y="151.6" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">15</text>
<rect x="96.8" y="301.9" width="50" height="78.1" fill="#d4d4d4" stroke="#ebebeb" rx="10"><title>Day 1: 5 invitations</title></rect>
<text x="121.8" y="291.9" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">5</text>
<text x="121.8" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 1</text>
<rect x="172.2" y="270.6" width="50" height="109.4" fill="#d4d4d4" stroke="#ebebeb" rx="10"><title>Day 2: 7 invitations</title></rect>
<text x="197.2" y="260.6" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">7</text>
<text x="197.2" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 2</text>
<rect x="247.8" y="239.4" width="50" height="140.6" fill="#d4d4d4" stroke="#ebebeb" rx="10"><title>Day 3: 9 invitations</title></rect>
<text x="272.8" y="229.4" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">9</text>
<text x="272.8" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 3</text>
<rect x="323.2" y="208.1" width="50" height="171.9" fill="#d4d4d4" stroke="#ebebeb" rx="10"><title>Day 4: 11 invitations</title></rect>
<text x="348.2" y="198.1" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">11</text>
<text x="348.2" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 4</text>
<rect x="398.8" y="176.9" width="50" height="203.1" fill="#d4d4d4" stroke="#ebebeb" rx="10"><title>Day 5: 13 invitations</title></rect>
<text x="423.8" y="166.9" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">13</text>
<text x="423.8" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 5</text>
<rect x="474.2" y="145.6" width="50" height="234.4" fill="#0c8c5e" stroke="#ebebeb" rx="10"><title>Day 6: 15 invitations</title></rect>
<text x="499.2" y="135.6" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">15</text>
<text x="499.2" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 6</text>
<rect x="549.8" y="145.6" width="50" height="234.4" fill="#0c8c5e" stroke="#ebebeb" rx="10"><title>Day 7: 15 invitations</title></rect>
<text x="574.8" y="135.6" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">15</text>
<text x="574.8" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 7</text>
<rect x="625.2" y="145.6" width="50" height="234.4" fill="#0c8c5e" stroke="#ebebeb" rx="10"><title>Day 8: 15 invitations</title></rect>
<text x="650.2" y="135.6" text-anchor="middle" font-size="22" font-weight="500" fill="#171717">15</text>
<text x="650.2" y="408" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 8</text>
<line x1="84" x2="688" y1="380" y2="380" stroke="#8a8a85"/>
<rect x="32" y="432" width="16" height="16" fill="#d4d4d4" stroke="#333333" rx="3"/><text x="56" y="446" font-size="19" fill="#171717">Warming up</text>
<rect x="200" y="432" width="16" height="16" fill="#0c8c5e" stroke="#333333" rx="3"/><text x="224" y="446" font-size="19" fill="#171717">Full limit</text>
<text x="32" y="482" font-size="18" fill="#737373">Each day's real total then lands between 80% and 100% of this cap.</text>
</svg>
