<title id="t">HubSpot Sales Hub plans per seat a month</title>
<desc id="d">HubSpot Sales Hub plans per seat a month: Free $0 for up to 2 users; Starter from $20, with 500 HubSpot Credits and a lower price for new customers; Professional $90 to $100 depending on how you pay, with 3,000 credits and a $1,500 onboarding fee; Enterprise from $150, with 5,000 credits and a $3,500 onboarding fee. From hubspot.com/pricing/sales, November 2026.</desc>
