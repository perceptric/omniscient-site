<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 774" width="720" height="774" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Where a LinkedIn reply ends up in each kind of CRM integration</title>
<desc id="d">Through Sales Navigator CRM Sync, in HubSpot, Salesforce and Dynamics 365: the rep messages in Sales Navigator, writeback logs the activity the rep picks, and the activity lands on the matched record. Through a browser extension, in folk and the Pipedrive and Attio apps: the rep saves the LinkedIn profile, the person lands in the CRM, and the thread stays in LinkedIn unless the app logs it. Through a connected account, in Omniscient and Breakcold: the reply arrives on LinkedIn, the CRM matches it to the right person, and the thread sits beside the record.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#333333"/></marker></defs>
<rect width="720" height="774" fill="#ffffff"/>
<text x="32" y="46" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Where a reply goes</text>
<text x="32" y="88" font-size="31" font-weight="500" fill="#171717">Three paths for <tspan fill="#171717">a LinkedIn reply</tspan></text>
<text x="32" y="150" font-size="23" font-weight="500" fill="#171717">Sales Navigator CRM Sync</text>
<text x="32" y="178" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">HubSpot, Salesforce, Dynamics 365</text>
<rect x="32.5" y="194.5" width="196" height="120" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="48" y="248" font-size="20" fill="#171717">Rep messages in</text>
<text x="48" y="274" font-size="20" fill="#171717">Sales Navigator</text>
<line x1="229" y1="254.5" x2="260" y2="254.5" stroke="#8a8a85" marker-end="url(#ar)"/>
<rect x="262.5" y="194.5" width="196" height="120" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="278" y="236" font-size="20" fill="#171717">Writeback logs</text>
<text x="278" y="261" font-size="20" fill="#171717">the activity</text>
<text x="278" y="286" font-size="20" fill="#171717">the rep picks</text>
<line x1="459" y1="254.5" x2="490" y2="254.5" stroke="#8a8a85" marker-end="url(#ar)"/>
<rect x="492.5" y="194.5" width="195" height="120" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="508" y="248" font-size="20" fill="#171717">Activity on the</text>
<text x="508" y="274" font-size="20" fill="#171717">matched record</text>
<text x="32" y="358" font-size="23" font-weight="500" fill="#171717">Browser extension</text>
<text x="32" y="386" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">folk, apps for Pipedrive and Attio</text>
<rect x="32.5" y="402.5" width="196" height="120" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="48" y="456" font-size="20" fill="#171717">Rep saves the</text>
<text x="48" y="482" font-size="20" fill="#171717">LinkedIn profile</text>
<line x1="229" y1="462.5" x2="260" y2="462.5" stroke="#8a8a85" marker-end="url(#ar)"/>
<rect x="262.5" y="402.5" width="196" height="120" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="278" y="456" font-size="20" fill="#171717">The person lands</text>
<text x="278" y="482" font-size="20" fill="#171717">in the CRM</text>
<line x1="459" y1="462.5" x2="490" y2="462.5" stroke="#8a8a85" marker-end="url(#ar)"/>
<rect x="492.5" y="402.5" width="195" height="120" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="508" y="432" font-size="20" fill="#171717">The thread</text>
<text x="508" y="456" font-size="20" fill="#171717">stays in LinkedIn</text>
<text x="508" y="482" font-size="20" fill="#171717">unless the app</text>
<text x="508" y="506" font-size="20" fill="#171717">logs it</text>
<text x="32" y="566" font-size="23" font-weight="500" fill="#171717">Connected LinkedIn account</text>
<text x="32" y="594" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Omniscient, Breakcold</text>
<rect x="32.5" y="610.5" width="196" height="120" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="48" y="664" font-size="20" fill="#171717">The reply arrives</text>
<text x="48" y="690" font-size="20" fill="#171717">on LinkedIn</text>
<line x1="229" y1="670.5" x2="260" y2="670.5" stroke="#8a8a85" marker-end="url(#ar)"/>
<rect x="262.5" y="610.5" width="196" height="120" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="278" y="652" font-size="20" fill="#171717">The CRM</text>
<text x="278" y="677" font-size="20" fill="#171717">matches it to</text>
<text x="278" y="702" font-size="20" fill="#171717">the right person</text>
<line x1="459" y1="670.5" x2="490" y2="670.5" stroke="#8a8a85" marker-end="url(#ar)"/>
<rect x="492.5" y="610.5" width="195" height="120" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<rect x="508.5" y="624.5" width="13" height="13" fill="#0c8c5e" stroke="#333333" rx="3"/>
<text x="508" y="672" font-size="20" fill="#171717">The thread sits</text>
<text x="508" y="698" font-size="20" fill="#171717">beside the record</text>
</svg>
