<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 774" width="720" height="774" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Where a LinkedIn reply ends up in each kind of CRM integration</title>
<desc id="d">Through Sales Navigator CRM Sync, in HubSpot, Salesforce and Dynamics 365: the rep messages in Sales Navigator, writeback logs the activity the rep picks, and the activity lands on the matched record. Through a browser extension, in folk and the Pipedrive and Attio apps: the rep saves the LinkedIn profile, the person lands in the CRM, and the thread stays in LinkedIn unless the app logs it. Through a connected account, in Omniscient and Breakcold: the reply arrives on LinkedIn, the CRM matches it to the right person, and the thread sits beside the record.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker></defs>
<rect width="720" height="774" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="773" fill="none" stroke="#0a0a0a"/>
<text x="32" y="46" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#737373">[Where a reply goes]</text>
<text x="32" y="88" font-size="31" font-weight="600" fill="#0a0a0a">Three paths for <tspan fill="#a3a3a3">a LinkedIn reply</tspan></text>
<text x="32" y="150" font-size="23" font-weight="600" fill="#0a0a0a">Sales Navigator CRM Sync</text>
<text x="32" y="178" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[HubSpot, Salesforce, Dynamics 365]</text>
<rect x="32.5" y="194.5" width="196" height="120" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="48" y="248" font-size="20" fill="#0a0a0a">Rep messages in</text>
<text x="48" y="274" font-size="20" fill="#0a0a0a">Sales Navigator</text>
<line x1="229" y1="254.5" x2="260" y2="254.5" stroke="#0a0a0a" marker-end="url(#ar)"/>
<rect x="262.5" y="194.5" width="196" height="120" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="278" y="236" font-size="20" fill="#0a0a0a">Writeback logs</text>
<text x="278" y="261" font-size="20" fill="#0a0a0a">the activity</text>
<text x="278" y="286" font-size="20" fill="#0a0a0a">the rep picks</text>
<line x1="459" y1="254.5" x2="490" y2="254.5" stroke="#0a0a0a" marker-end="url(#ar)"/>
<rect x="492.5" y="194.5" width="195" height="120" fill="#ffffff" stroke="#0a0a0a"/>
<text x="508" y="248" font-size="20" fill="#0a0a0a">Activity on the</text>
<text x="508" y="274" font-size="20" fill="#0a0a0a">matched record</text>
<text x="32" y="358" font-size="23" font-weight="600" fill="#0a0a0a">Browser extension</text>
<text x="32" y="386" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[folk, apps for Pipedrive and Attio]</text>
<rect x="32.5" y="402.5" width="196" height="120" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="48" y="456" font-size="20" fill="#0a0a0a">Rep saves the</text>
<text x="48" y="482" font-size="20" fill="#0a0a0a">LinkedIn profile</text>
<line x1="229" y1="462.5" x2="260" y2="462.5" stroke="#0a0a0a" marker-end="url(#ar)"/>
<rect x="262.5" y="402.5" width="196" height="120" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="278" y="456" font-size="20" fill="#0a0a0a">The person lands</text>
<text x="278" y="482" font-size="20" fill="#0a0a0a">in the CRM</text>
<line x1="459" y1="462.5" x2="490" y2="462.5" stroke="#0a0a0a" marker-end="url(#ar)"/>
<rect x="492.5" y="402.5" width="195" height="120" fill="#ffffff" stroke="#0a0a0a"/>
<text x="508" y="432" font-size="20" fill="#0a0a0a">The thread</text>
<text x="508" y="456" font-size="20" fill="#0a0a0a">stays in LinkedIn</text>
<text x="508" y="482" font-size="20" fill="#0a0a0a">unless the app</text>
<text x="508" y="506" font-size="20" fill="#0a0a0a">logs it</text>
<text x="32" y="566" font-size="23" font-weight="600" fill="#0a0a0a">Connected LinkedIn account</text>
<text x="32" y="594" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Omniscient, Breakcold]</text>
<rect x="32.5" y="610.5" width="196" height="120" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="48" y="664" font-size="20" fill="#0a0a0a">The reply arrives</text>
<text x="48" y="690" font-size="20" fill="#0a0a0a">on LinkedIn</text>
<line x1="229" y1="670.5" x2="260" y2="670.5" stroke="#0a0a0a" marker-end="url(#ar)"/>
<rect x="262.5" y="610.5" width="196" height="120" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="278" y="652" font-size="20" fill="#0a0a0a">The CRM</text>
<text x="278" y="677" font-size="20" fill="#0a0a0a">matches it to</text>
<text x="278" y="702" font-size="20" fill="#0a0a0a">the right person</text>
<line x1="459" y1="670.5" x2="490" y2="670.5" stroke="#0a0a0a" marker-end="url(#ar)"/>
<rect x="492.5" y="610.5" width="195" height="120" fill="#ffffff" stroke="#0a0a0a"/>
<rect x="508.5" y="624.5" width="13" height="13" fill="#10b981" stroke="#0a0a0a"/>
<text x="508" y="672" font-size="20" fill="#0a0a0a">The thread sits</text>
<text x="508" y="698" font-size="20" fill="#0a0a0a">beside the record</text>
</svg>
