<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 882" width="720" height="882" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Four kinds of CRM with LinkedIn integration</title>
<desc id="d">A LinkedIn profile inside the record, which puts a Sales Navigator card on records and needs Sales Navigator Advanced Plus: Zoho CRM, Dynamics 365, HubSpot and Salesforce. Sales Navigator CRM Sync, which syncs records and activity and needs Advanced Plus: HubSpot, Salesforce, Dynamics 365 and Oracle Sales. A browser extension that saves LinkedIn profiles and works with any LinkedIn account: folk, Salesflare, Nimble, and apps for Pipedrive and Attio. A connected LinkedIn account, where conversations reach records and any LinkedIn account works: Omniscient, Breakcold, NetHunt CRM and Kanbox.</desc>
