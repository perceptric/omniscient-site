<style>.sfi-body{padding:14px 16px 16px;display:grid;gap:12px}.sfi-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--frame);border-radius:10px;overflow:hidden}.sfi-pick>span{display:flex;align-items:center;justify-content:center;gap:7px;height:40px;font-size:12.5px;font-weight:500;color:var(--ink-2)}.sfi-pick>span+span{border-left:1px solid var(--line)}.sfi-pick>span.on{background:var(--solid);color:#fff}.sfi-pick>span.on img{background:#fff}.sfi-go{justify-content:center;width:100%;height:32px}.sfi-list{border:1px solid var(--line);border-radius:10px;overflow:hidden}.sfi-row{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:12.5px}.sfi-row+.sfi-row{border-top:1px solid var(--line)}.sfi-row b{display:block;font-weight:600}.sfi-row small{display:block;color:var(--ink-2);font-size:11.5px}.sfi-x{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--frame);font-size:14px;border-radius:8px;overflow:hidden}.sfi-f{display:flex;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line)}@media (max-width:560px){.sfi-pick .sfi-nm{display:none}}</style>
