<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 894" width="560" height="894" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What a Salesforce import brings over to Omniscient</title>
<desc id="d">What Omniscient&#x27;s Salesforce importer brings over and where each record lands. Accounts with their name and website become companies, matched by domain. Contacts with an email become people, linked to their company. Leads not yet converted become people, linked to a company from their website or work email. Active opportunity stages become one pipeline, with won and lost stages kept. Opportunities with amount, close date and owner become opportunities, with the owner matched to a teammate by email. Classic notes on accounts, contacts and opportunities land on the same record. Tasks, events, cases, files, enhanced notes, custom objects and custom fields stay in Salesforce, and contacts and leads with no email are skipped. The importer only reads, and its saved Salesforce login is deleted when the import finishes.</desc>
<rect width="560" height="894" fill="#ffffff"/>
<text x="24" y="46" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Salesforce import</text>
<text x="24" y="84" font-size="26" font-weight="500" fill="#171717">What comes over <tspan fill="#171717">and where it lands</tspan></text>
<text x="24" y="132" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Salesforce</text>
<text x="302" y="132" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Omniscient</text>
<rect x="24" y="146" width="236" height="72" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="38" y="177" font-size="20" font-weight="500" fill="#171717">Accounts</text>
<text x="38" y="202" font-size="16" fill="#737373">name and website</text>
<line x1="266" y1="182" x2="290" y2="182" stroke="#8a8a85" stroke-width="2"/>
<path d="M284 176 L292 182 L284 188" fill="none" stroke="#8a8a85" stroke-width="2"/>
<rect x="300" y="146" width="236" height="72" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="314" y="177" font-size="20" font-weight="500" fill="#171717">Companies</text>
<text x="314" y="202" font-size="16" fill="#737373">matched by domain</text>
<rect x="24" y="232" width="236" height="72" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="38" y="263" font-size="20" font-weight="500" fill="#171717">Contacts</text>
<text x="38" y="288" font-size="16" fill="#737373">with an email</text>
<line x1="266" y1="268" x2="290" y2="268" stroke="#8a8a85" stroke-width="2"/>
<path d="M284 262 L292 268 L284 274" fill="none" stroke="#8a8a85" stroke-width="2"/>
<rect x="300" y="232" width="236" height="72" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="314" y="263" font-size="20" font-weight="500" fill="#171717">People</text>
<text x="314" y="288" font-size="16" fill="#737373">linked to their company</text>
<rect x="24" y="318" width="236" height="72" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="38" y="349" font-size="20" font-weight="500" fill="#171717">Leads</text>
<text x="38" y="374" font-size="16" fill="#737373">not yet converted</text>
<line x1="266" y1="354" x2="290" y2="354" stroke="#8a8a85" stroke-width="2"/>
<path d="M284 348 L292 354 L284 360" fill="none" stroke="#8a8a85" stroke-width="2"/>
<rect x="300" y="318" width="236" height="72" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="314" y="349" font-size="20" font-weight="500" fill="#171717">People</text>
<text x="314" y="374" font-size="16" fill="#737373">company from domain</text>
<rect x="24" y="404" width="236" height="72" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="38" y="435" font-size="20" font-weight="500" fill="#171717">Opportunity stages</text>
<text x="38" y="460" font-size="16" fill="#737373">active stages</text>
<line x1="266" y1="440" x2="290" y2="440" stroke="#8a8a85" stroke-width="2"/>
<path d="M284 434 L292 440 L284 446" fill="none" stroke="#8a8a85" stroke-width="2"/>
<rect x="300" y="404" width="236" height="72" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="314" y="435" font-size="20" font-weight="500" fill="#171717">One pipeline</text>
<text x="314" y="460" font-size="16" fill="#737373">won and lost kept</text>
<rect x="24" y="490" width="236" height="72" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="38" y="521" font-size="20" font-weight="500" fill="#171717">Opportunities</text>
<text x="38" y="546" font-size="16" fill="#737373">amount, close date, owner</text>
<line x1="266" y1="526" x2="290" y2="526" stroke="#8a8a85" stroke-width="2"/>
<path d="M284 520 L292 526 L284 532" fill="none" stroke="#8a8a85" stroke-width="2"/>
<rect x="300" y="490" width="236" height="72" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="314" y="521" font-size="20" font-weight="500" fill="#171717">Opportunities</text>
<text x="314" y="546" font-size="16" fill="#737373">owner matched by email</text>
<rect x="24" y="576" width="236" height="96" fill="#f5f5f5" stroke="#ebebeb" rx="10"/>
<text x="38" y="607" font-size="20" font-weight="500" fill="#171717">Classic notes</text>
<text x="38" y="632" font-size="16" fill="#737373">on accounts, contacts</text>
<text x="38" y="656" font-size="16" fill="#737373">and opportunities</text>
<line x1="266" y1="624" x2="290" y2="624" stroke="#8a8a85" stroke-width="2"/>
<path d="M284 618 L292 624 L284 630" fill="none" stroke="#8a8a85" stroke-width="2"/>
<rect x="300" y="576" width="236" height="96" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<text x="314" y="607" font-size="20" font-weight="500" fill="#171717">Notes</text>
<text x="314" y="632" font-size="16" fill="#737373">on the same record</text>
<text x="24" y="720" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#737373">Stays in Salesforce</text>
<text x="24" y="750" font-size="18" fill="#171717">Tasks, events, cases and files</text>
<text x="24" y="776" font-size="18" fill="#171717">Enhanced notes, custom objects and fields</text>
<rect x="24" y="801" width="16" height="16" fill="#0c8c5e" stroke="#333333" rx="3"/>
<text x="52" y="816" font-size="18" fill="#171717">Skipped: contacts and leads with no email</text>
<text x="24" y="860" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">Reads only. Its login is deleted at the end.</text>
</svg>
