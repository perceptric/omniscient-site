<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 660" width="560" height="660" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Salesforce Sales Cloud editions, price per user a month</title>
<desc id="d">Price per user a month for each Salesforce Sales Cloud edition, from Salesforce&#x27;s pricing page on November 3, 2026. Free Suite: $0, for up to 2 users. Starter Suite: $25, billed monthly or yearly. Pro Suite: $100, billed yearly, and the first edition with sales quoting and forecasting. Core: $195, Advanced: $395 and Max: $550, each billed yearly. Agentforce for Sales is an add on from $125 per user a month, and the page says AI can be added to Core and above.</desc>
<rect width="560" height="660" fill="#ffffff"/>
<text x="24" y="46" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Salesforce Sales Cloud</text>
<text x="24" y="84" font-size="26" font-weight="500" fill="#171717">Price per user a month <tspan fill="#171717">by edition</tspan></text>
