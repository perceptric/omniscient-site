<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 842" width="560" height="842" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">First paid seat on each Salesforce alternative, billed yearly</title>
<desc id="d">Price per seat a month on yearly billing, on each alternative&#x27;s first paid plan, as of November 2026: Freshsales Growth $9, Twenty Pro $9, monday CRM Basic $12 from 3 seats, Omniscient Starter $19, Copper Basic $23, Salesflare Growth $29 and Attio Plus $35 for each user after the first. Outlined for comparison: Salesforce Starter Suite at $25 and Salesforce Pro Suite at $100. Plans include different features. Not shown: HubSpot, Close, folk and Nutshell, which price their first plan in other ways, and Pipedrive and Zoho CRM, whose paid plans are on their sites.</desc>
