<title id="t">What each folk plan adds</title>
<desc id="d">What each folk plan adds: Standard has pipelines, email campaigns, contact enrichment and AI assistants; Premium adds deals and custom objects, email sequences, dashboards, workspace roles and API access; Enterprise adds custom limits, group-level permissions, security controls and a dedicated account manager.</desc>
