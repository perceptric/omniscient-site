<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 792" width="720" height="792" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Moving one LinkedIn account off Expandi, day by day</title>
<desc id="d">A switch plan in six steps. Day 1, in Expandi: Stop every campaign. The account stays active until the seat ends. Day 1, in Expandi: Save your lists and blacklist. Note everyone who already heard from you. Day 1, in Expandi: Remove the seat. Disconnecting alone keeps the seat billed. Day 2, in New tool: Load your do not contact list. Then connect the LinkedIn account. Days 2 to 6, in New tool: Warm up: 5, 7, 9, 11, 13 a day. Invitations allowed at the Normal pace. Day 7 on, in New tool: Up to 15 a day, the Normal pace. Raise limits once acceptance holds above 20%. Warmup numbers are Omniscient&#x27;s defaults for a newly connected sender at the Normal pace.</desc>
<rect width="720" height="792" fill="#ffffff"/>
<text x="32" y="48" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Switching</text>
<text x="32" y="88" font-size="29" font-weight="500" fill="#171717">One account off Expandi <tspan fill="#171717">day by day</tspan></text>
