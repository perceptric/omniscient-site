<rect x="179" y="438" width="101" height="24" fill="#e3f4ec" stroke="#086444" rx="6"/>
<text x="229" y="455" text-anchor="middle" font-size="17" fill="#086444">New tool</text>
<text x="84" y="490" font-size="23" font-weight="500" fill="#171717">Load your do not contact list</text>
