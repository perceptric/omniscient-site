<text x="84" y="190" font-size="23" font-weight="500" fill="#171717">Stop every campaign</text>
<text x="84" y="218" font-size="21" fill="#737373">The account stays active until the seat ends.</text>
<rect x="43" y="239" width="18" height="18" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="84" y="255" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#737373">Day 1</text>
<rect x="179" y="238" width="90" height="24" fill="#f5f5f5" stroke="#737373" rx="6"/>
<text x="224" y="255" text-anchor="middle" font-size="17" fill="#525252">Expandi</text>
<text x="84" y="290" font-size="23" font-weight="500" fill="#171717">Save your lists and blacklist</text>
<text x="84" y="318" font-size="21" fill="#737373">Note everyone who already heard from you.</text>
