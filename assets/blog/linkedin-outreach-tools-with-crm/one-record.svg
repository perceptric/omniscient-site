<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 670" width="720" height="670" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How a LinkedIn lead becomes one CRM record in Omniscient</title>
<desc id="d">Step 1: Saved to a list or a campaign. A Scout result becomes a CRM person only once you keep it. Step 2: Matched before anything is made, by profile ID, then by LinkedIn address. Step 3: Company matched by web domain. With no domain yet, no new company is made. Step 4: Your edits stay as they are. New data only fills empty fields. Step 5: Every touch on one timeline: LinkedIn, email and meetings together. Emails and meetings join the same person once the record has their email address.</desc>
<rect width="720" height="670" fill="#ffffff"/>
<text x="32" y="46" font-family="Inter, system-ui, sans-serif" font-size="17" fill="#737373">One person, one record</text>
<text x="32" y="86" font-size="30" font-weight="500" fill="#171717">From LinkedIn lead <tspan fill="#171717">to CRM record</tspan></text>
<rect x="32.5" y="116.5" width="655" height="79" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="116.5" width="79" height="79" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="72" y="163" font-family="Inter, system-ui, sans-serif" text-anchor="middle" font-size="22" fill="#171717">01</text>
<text x="132" y="150" font-weight="500" font-size="23" fill="#171717">Saved to a list or a campaign</text>
<text x="132" y="178" font-size="20" fill="#737373">A Scout result becomes a person once kept</text>
<line x1="72" x2="72" y1="196" y2="210" stroke="#8a8a85"/>
<rect x="32.5" y="210.5" width="655" height="79" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="210.5" width="79" height="79" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="72" y="257" font-family="Inter, system-ui, sans-serif" text-anchor="middle" font-size="22" fill="#171717">02</text>
<text x="132" y="244" font-weight="500" font-size="23" fill="#171717">Matched before anything is made</text>
<text x="132" y="272" font-size="20" fill="#737373">By profile ID, then LinkedIn address</text>
<line x1="72" x2="72" y1="290" y2="304" stroke="#8a8a85"/>
<rect x="32.5" y="304.5" width="655" height="79" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="304.5" width="79" height="79" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="72" y="351" font-family="Inter, system-ui, sans-serif" text-anchor="middle" font-size="22" fill="#171717">03</text>
<text x="132" y="338" font-weight="500" font-size="23" fill="#171717">Company matched by web domain</text>
<text x="132" y="366" font-size="20" fill="#737373">No domain yet, no new company</text>
<line x1="72" x2="72" y1="384" y2="398" stroke="#8a8a85"/>
<rect x="32.5" y="398.5" width="655" height="79" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="398.5" width="79" height="79" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="72" y="445" font-family="Inter, system-ui, sans-serif" text-anchor="middle" font-size="22" fill="#171717">04</text>
<text x="132" y="432" font-weight="500" font-size="23" fill="#171717">Your edits stay as they are</text>
<text x="132" y="460" font-size="20" fill="#737373">New data only fills empty fields</text>
<line x1="72" x2="72" y1="478" y2="492" stroke="#8a8a85"/>
<rect x="32.5" y="492.5" width="655" height="79" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32.5" y="492.5" width="79" height="79" fill="#0c8c5e" stroke="#ebebeb"/>
<text x="72" y="539" font-family="Inter, system-ui, sans-serif" text-anchor="middle" font-size="22" fill="#171717">05</text>
<text x="132" y="526" font-weight="500" font-size="23" fill="#171717">Every touch on one timeline</text>
<text x="132" y="554" font-size="20" fill="#737373">LinkedIn, email and meetings together</text>
<text x="32" y="610" font-size="21" fill="#737373">Emails and meetings join the same person</text>
<text x="32" y="640" font-size="21" fill="#737373">once the record has their email address.</text>
</svg>
