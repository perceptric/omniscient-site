<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 730" width="720" height="730" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Three kinds of LinkedIn outreach tool with a CRM</title>
<desc id="d">Outreach and CRM in one product, which sends invitations and keeps full records: Omniscient and NetHunt CRM. LinkedIn automation with a light CRM of tags, notes and pipeline stages: Kanbox, Meet Alfred and Linked Helper. A CRM that holds LinkedIn contacts, where the record comes first: Breakcold and folk. Or keep the CRM you have and sync an outreach tool into it, such as HeyReach, La Growth Machine, Waalaxy or Closely.</desc>
<rect width="720" height="730" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="729" fill="none" stroke="#0a0a0a"/>
<text x="32" y="46" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Three kinds]</text>
<text x="32" y="86" font-size="30" font-weight="600" fill="#0a0a0a">What the CRM part <tspan fill="#a3a3a3">really means</tspan></text>
<rect x="32.5" y="124.5" width="300" height="150" fill="#f5f5f5" stroke="#0a0a0a"/>
