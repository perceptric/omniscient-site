<text x="50" y="410" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Tags, notes, stages]</text>
<rect x="354.5" y="321.5" width="14" height="14" fill="#d4d4d4" stroke="#0a0a0a"/>
<text x="382" y="336" font-size="22" fill="#0a0a0a">Kanbox</text>
<rect x="354.5" y="359.5" width="14" height="14" fill="#d4d4d4" stroke="#0a0a0a"/>
<text x="382" y="374" font-size="22" fill="#0a0a0a">Meet Alfred</text>
<rect x="354.5" y="397.5" width="14" height="14" fill="#d4d4d4" stroke="#0a0a0a"/>
<text x="382" y="412" font-size="22" fill="#0a0a0a">Linked Helper</text>
<rect x="32.5" y="452.5" width="300" height="150" fill="#f5f5f5" stroke="#0a0a0a"/>
<rect x="332.5" y="452.5" width="355" height="150" fill="#ffffff" stroke="#0a0a0a"/>
<text x="50" y="494" font-weight="600" font-size="23" fill="#0a0a0a">A CRM that holds</text>
<text x="50" y="522" font-weight="600" font-size="23" fill="#0a0a0a">LinkedIn contacts</text>
<text x="50" y="574" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Record comes first]</text>
