<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 970" width="720" height="970" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Four kinds of LinkedIn outreach tool with a CRM</title>
<desc id="d">Outreach and CRM in one product, which sends invitations and keeps full records: Omniscient and NetHunt CRM. LinkedIn automation with a light CRM of tags, notes and pipeline stages: Kanbox, Meet Alfred, Linked Helper, Dripify and Waalaxy. A CRM that holds LinkedIn contacts, where the record comes first: Breakcold, folk, Salesflare and HubSpot Sales Hub. Outreach synced into the CRM you keep: La Growth Machine, lemlist, HeyReach and Closely.</desc>
