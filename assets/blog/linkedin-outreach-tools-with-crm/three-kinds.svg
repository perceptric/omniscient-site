<text x="50" y="194" font-weight="600" font-size="23" fill="#0a0a0a">in one product</text>
<text x="50" y="246" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Sends and records]</text>
<rect x="354.5" y="157.5" width="14" height="14" fill="#10b981" stroke="#0a0a0a"/>
<text x="382" y="172" font-size="22" fill="#0a0a0a">Omniscient</text>
<rect x="354.5" y="195.5" width="14" height="14" fill="#10b981" stroke="#0a0a0a"/>
<text x="382" y="210" font-size="22" fill="#0a0a0a">NetHunt CRM</text>
<rect x="32.5" y="288.5" width="300" height="150" fill="#f5f5f5" stroke="#0a0a0a"/>
<rect x="332.5" y="288.5" width="355" height="150" fill="#ffffff" stroke="#0a0a0a"/>
<text x="50" y="330" font-weight="600" font-size="23" fill="#0a0a0a">Automation with</text>
