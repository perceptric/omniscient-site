<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" width="720" height="462" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Copper plans per seat a month, billed yearly</title>
<desc id="d">Copper plans per seat a month on yearly billing: Basic $23, or $29 billed monthly, with up to 2,500 contacts; Professional $59, or $69 billed monthly, with up to 15,000 contacts; Business $99, or $134 billed monthly, with any number of contacts. From copper.com/pricing, November 2026.</desc>
<rect width="720" height="462" fill="#ffffff"/>
<text x="32" y="48" font-size="19" fill="#737373">Copper pricing</text>
<text x="32" y="88" font-size="30" font-weight="500" fill="#171717">Per seat a month, billed yearly</text>
<rect x="32" y="116" width="656" height="286" fill="#ffffff" stroke="#ebebeb"/>
<rect x="32" y="116" width="656" height="46" fill="#f5f5f5" stroke="#ebebeb"/>
<text x="52" y="146" font-size="18" fill="#404040">Plan</text>
<text x="668" y="146" text-anchor="end" font-size="18" fill="#404040">Billed yearly</text>
<text x="52" y="196" font-size="20" font-weight="500" fill="#171717">Basic</text>
<text x="668" y="196" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$23</text>
<text x="52" y="222" font-size="18" fill="#737373">Per seat, $29 billed monthly, 2,500 contacts</text>
<line x1="33" x2="687" y1="242" y2="242" stroke="#ebebeb"/>
<text x="52" y="276" font-size="20" font-weight="500" fill="#171717">Professional</text>
<text x="668" y="276" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$59</text>
<text x="52" y="302" font-size="18" fill="#737373">Per seat, $69 billed monthly, 15,000 contacts</text>
<line x1="33" x2="687" y1="322" y2="322" stroke="#ebebeb"/>
<text x="52" y="356" font-size="20" font-weight="500" fill="#171717">Business</text>
<text x="668" y="356" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$99</text>
<text x="52" y="382" font-size="18" fill="#737373">Per seat, $134 billed monthly, any number</text>
<text x="32" y="436" font-size="18" fill="#737373">From copper.com/pricing, November 2026.</text>
