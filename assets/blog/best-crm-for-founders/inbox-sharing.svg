<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">What a teammate sees <tspan fill="#a3a3a3">from your inbox</tspan></text>

<rect x="32.5" y="120.5" width="655" height="71" fill="#f5f5f5"/>
