<text x="48" y="163" font-family="Geist Mono, ui-monospace, monospace" font-size="15" fill="#737373">[Sharing rule]</text>
<text x="332" y="163" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Full access</text>
<text x="475" y="152" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Who and when</text>
<text x="475" y="176" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">only</text>
<text x="617" y="163" text-anchor="middle" font-size="18" font-weight="600" fill="#0a0a0a">Only me</text>

<text x="48" y="230" font-size="19" fill="#0a0a0a">Who and when</text>
