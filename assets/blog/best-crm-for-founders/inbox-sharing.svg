<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" width="720" height="620" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What a teammate sees from your inbox in Omniscient</title>
<desc id="d">Each connected inbox has one of three sharing rules. Full access shows teammates who and when, the subject and preview, Otto's facts and the quotes behind them. Who and when only shows who you emailed or met and when, plus Otto's facts without their quotes. Only me shows teammates nothing from that inbox. Separately, people whose emails or domains are on your do not track list are never synced from your inbox.</desc>
