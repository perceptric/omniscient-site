<title id="t">What each Close plan adds</title>
<desc id="d">What each Close plan adds: Solo has built-in calling, email and SMS, the AI Notetaker and Chloe, the AI assistant; Essentials adds unlimited users, Local Presence calling and team performance reports; Growth adds the Power Dialer, Workflows and AI Playbooks; Scale adds the Predictive Dialer, live call coaching and custom objects.</desc>
