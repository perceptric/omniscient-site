<text x="668" y="196" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$9</text>
<text x="52" y="222" font-size="18" fill="#737373">1 user, $19 billed monthly</text>
<line x1="33" x2="687" y1="242" y2="242" stroke="#ebebeb"/>
<text x="52" y="276" font-size="20" font-weight="500" fill="#171717">Essentials</text>
<text x="668" y="276" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$35</text>
<text x="52" y="302" font-size="18" fill="#737373">Per user, $49 billed monthly</text>
<line x1="33" x2="687" y1="322" y2="322" stroke="#ebebeb"/>
