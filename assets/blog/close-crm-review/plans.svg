<text x="668" y="356" text-anchor="end" font-size="22" font-weight="500" fill="#171717">$99</text>
<text x="52" y="382" font-size="18" fill="#737373">Per user, $109 billed monthly</text>
<line x1="33" x2="687" y1="402" y2="402" stroke="#ebebeb"/>
