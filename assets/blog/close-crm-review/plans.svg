<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 542" width="720" height="542" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Close plans a month, billed yearly</title>
<desc id="d">Close plans a month on yearly billing: Solo $9 for 1 user, or $19 billed monthly; Essentials $35 per user, or $49 billed monthly; Growth $99 per user, or $109 billed monthly; Scale $139 per user, or $149 billed monthly. Calling and SMS usage is billed on top. From close.com/pricing, November 2026.</desc>
