<title id="t">What a seat costs on each plan, billed yearly</title>
<desc id="d">Price per seat a month on yearly billing, for each plan, from each vendor&#x27;s pricing page in November 2026. Omniscient: Starter $19, Pro $49, Business $99. Twenty: Pro $9, Organization $39. folk: Standard $24, Premium $48, Enterprise from $80. Attio: Plus $35, Pro $79, Enterprise custom. Not shown: HubSpot and Close, whose pricing pages don&#x27;t label which price is yearly; Pipedrive, whose pricing page we couldn&#x27;t read; Clarify, which costs $50 a month for the whole team on Starter; and Affinity, which costs $2,000 per user a year on Essential.</desc>
