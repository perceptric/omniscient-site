<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1154" width="560" height="1154" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What a seat costs on each plan, billed yearly</title>
<desc id="d">Price per seat a month on yearly billing, for each plan, from each vendor&#x27;s pricing page in November 2026. Omniscient: Starter $19, Pro $49, Business $99. Twenty: Pro $9, Organization $39. monday CRM: Basic $12, Standard $17, Pro $28, from 3 seats. Copper: Basic $23, Professional $59, Business $99. folk: Standard $24, Premium $48, Enterprise from $80. Salesflare: Growth $29, Pro $49, Enterprise $99. Attio: Plus $35, Pro $79, Enterprise custom. Not shown: HubSpot and Close, whose pricing pages don&#x27;t label which price is yearly; Pipedrive, whose pricing page we couldn&#x27;t read; Clarify, which costs $50 a month for the whole team on Starter; Affinity, which costs $2,000 per user a year on Essential; Day AI, which prices each agent from $24 a month; and Lightfield, which costs $89 per user a month billed monthly on Starter.</desc>
