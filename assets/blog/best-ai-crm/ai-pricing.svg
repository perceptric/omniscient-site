<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 692" width="720" height="692" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How AI CRMs charge for AI</title>
<desc id="d">Omniscient includes AI in each paid seat, from $19 a month billed yearly. HubSpot, Attio, Close and folk give each plan a monthly AI allowance. Day AI prices each paid seat as an agent, from $24 a month billed yearly. Clarify has a free plan, then charges $50 a month for the team, with credits and any number of seats. Salesforce adds AI on Core, at $195 per user a month, and above. Pipedrive is left out because we could not read its pricing page.</desc>
<rect width="720" height="692" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="691" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[AI pricing]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">Five ways to pay for AI <tspan fill="#a3a3a3">in a CRM</tspan></text>
<rect x="32.5" y="124.5" width="199" height="83" fill="#10b981" stroke="#0a0a0a"/>
<rect x="232.5" y="124.5" width="455" height="83" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="160" font-size="21" font-weight="600" fill="#0a0a0a">Included</text>
<text x="48" y="186" font-size="21" font-weight="600" fill="#0a0a0a">in the seat</text>
<text x="248" y="160" font-size="21" font-weight="600" fill="#0a0a0a">Omniscient</text>
<text x="248" y="188" font-size="19" fill="#737373">Paid seats from $19 a month, billed yearly</text>
<rect x="32.5" y="220.5" width="199" height="83" fill="#f5f5f5" stroke="#0a0a0a"/>
<rect x="232.5" y="220.5" width="455" height="83" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="256" font-size="21" font-weight="600" fill="#0a0a0a">Seat plus</text>
<text x="48" y="282" font-size="21" font-weight="600" fill="#0a0a0a">AI credits</text>
<text x="248" y="256" font-size="21" font-weight="600" fill="#0a0a0a">HubSpot, Attio, Close, folk</text>
<text x="248" y="284" font-size="19" fill="#737373">A monthly AI allowance with each plan</text>
<rect x="32.5" y="316.5" width="199" height="83" fill="#f5f5f5" stroke="#0a0a0a"/>
<rect x="232.5" y="316.5" width="455" height="83" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="352" font-size="21" font-weight="600" fill="#0a0a0a">Priced</text>
<text x="48" y="378" font-size="21" font-weight="600" fill="#0a0a0a">per agent</text>
<text x="248" y="352" font-size="21" font-weight="600" fill="#0a0a0a">Day AI</text>
<text x="248" y="380" font-size="19" fill="#737373">From $24 per agent a month, billed yearly</text>
<rect x="32.5" y="412.5" width="199" height="83" fill="#f5f5f5" stroke="#0a0a0a"/>
<rect x="232.5" y="412.5" width="455" height="83" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="448" font-size="21" font-weight="600" fill="#0a0a0a">Credits,</text>
<text x="48" y="474" font-size="21" font-weight="600" fill="#0a0a0a">any seats</text>
<text x="248" y="448" font-size="21" font-weight="600" fill="#0a0a0a">Clarify</text>
<text x="248" y="476" font-size="19" fill="#737373">Free plan, then $50 a month for the team</text>
<rect x="32.5" y="508.5" width="199" height="83" fill="#f5f5f5" stroke="#0a0a0a"/>
<rect x="232.5" y="508.5" width="455" height="83" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="544" font-size="21" font-weight="600" fill="#0a0a0a">On higher</text>
<text x="48" y="570" font-size="21" font-weight="600" fill="#0a0a0a">editions</text>
<text x="248" y="544" font-size="21" font-weight="600" fill="#0a0a0a">Salesforce</text>
<text x="248" y="572" font-size="19" fill="#737373">AI can be added to Core ($195) and above</text>
<text x="32" y="634" font-size="19" fill="#737373">Prices from each vendor's pricing page, November 2026.</text>
<text x="32" y="660" font-size="19" fill="#737373">Pipedrive is left out: we could not read its pricing page.</text>
</svg>
