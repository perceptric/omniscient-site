<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 772" width="720" height="772" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How Omniscient decides whether an AI value fills a CRM field</title>
<desc id="d">An email, meeting or call comes in. Otto proposes a value with a quote. If Otto is under 60% sure or has no quote, the value is dropped. If a person typed the field, it is left as it is. If the field rule is on auto, the field is empty and Otto is at least 85% sure, the field is filled and the quote is saved. Otherwise the value waits in Suggestions for you to accept or skip. A conversation from a private inbox never fills a field on its own.</desc>
<rect width="720" height="772" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="771" fill="none" stroke="#0a0a0a"/>
<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[How a field gets filled]</text>
<text x="32" y="88" font-size="28" font-weight="600" fill="#0a0a0a">Every value keeps its quote <tspan fill="#a3a3a3">or waits for you</tspan></text>
<rect x="32.5" y="124.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="164" font-size="21" fill="#0a0a0a">An email, meeting or call comes in</text>
<line x1="72" x2="72" y1="188" y2="215" stroke="#0a0a0a"/>
<polygon points="67,215 72,224 77,215" fill="#0a0a0a"/>
<rect x="32.5" y="224.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="264" font-size="21" fill="#0a0a0a">Otto proposes a value with a quote</text>
<line x1="72" x2="72" y1="288" y2="315" stroke="#0a0a0a"/>
<polygon points="67,315 72,324 77,315" fill="#0a0a0a"/>
<rect x="32.5" y="324.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="364" font-size="21" fill="#0a0a0a">Under 60% sure, or no quote?</text>
<line x1="452" x2="489" y1="356" y2="356" stroke="#0a0a0a"/>
<polygon points="489,351 498,356 489,361" fill="#0a0a0a"/>
<text x="459" y="347" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">Yes</text>
<rect x="498.5" y="324.5" width="189" height="63" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="514" y="364" font-size="21" font-weight="600" fill="#0a0a0a">Dropped</text>
<line x1="72" x2="72" y1="388" y2="415" stroke="#0a0a0a"/>
<polygon points="67,415 72,424 77,415" fill="#0a0a0a"/>
<text x="84" y="412" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">No</text>
<rect x="32.5" y="424.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="464" font-size="21" fill="#0a0a0a">Did a person type this field?</text>
<line x1="452" x2="489" y1="456" y2="456" stroke="#0a0a0a"/>
<polygon points="489,451 498,456 489,461" fill="#0a0a0a"/>
<text x="459" y="447" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">Yes</text>
<rect x="498.5" y="424.5" width="189" height="63" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="514" y="464" font-size="21" font-weight="600" fill="#0a0a0a">Left as it is</text>
<line x1="72" x2="72" y1="488" y2="515" stroke="#0a0a0a"/>
<polygon points="67,515 72,524 77,515" fill="#0a0a0a"/>
<text x="84" y="512" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">No</text>
<rect x="32.5" y="524.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="564" font-size="21" fill="#0a0a0a">Auto rule, empty, at least 85% sure?</text>
<line x1="452" x2="489" y1="556" y2="556" stroke="#0a0a0a"/>
<polygon points="489,551 498,556 489,561" fill="#0a0a0a"/>
<text x="459" y="547" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">Yes</text>
<rect x="498.5" y="524.5" width="189" height="63" fill="#10b981" stroke="#0a0a0a"/>
<text x="514" y="552" font-size="20" font-weight="600" fill="#0a0a0a">Filled,</text>
<text x="514" y="576" font-size="20" font-weight="600" fill="#0a0a0a">quote saved</text>
<line x1="72" x2="72" y1="588" y2="615" stroke="#0a0a0a"/>
<polygon points="67,615 72,624 77,615" fill="#0a0a0a"/>
<text x="84" y="612" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">No</text>
<rect x="32.5" y="624.5" width="419" height="63" fill="#ffffff" stroke="#0a0a0a"/>
<text x="48" y="664" font-size="21" font-weight="600" fill="#0a0a0a">Waits in Suggestions for you</text>
<text x="32" y="736" font-size="19" fill="#737373">A conversation from a private inbox never fills a field on its own.</text>
</svg>
