<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1244" width="720" height="1244" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Who does each LinkedIn safety job in HeyReach, Expandi and Omniscient</title>
<desc id="d">Who handles five LinkedIn safety jobs in HeyReach, Expandi and Omniscient, from each vendor&#x27;s own pages. Warming up a new account: by you in HeyReach, to 100 connections before you connect; automatic in Expandi, 5 actions a day plus 3 every two days up to 21; automatic in Omniscient, 5 invitations a day plus 2 each day. Varying the working day: by you in HeyReach, which asks for an 8 to 12 hour window; by you in Expandi, whose help center suggests varying your hours each day; automatic in Omniscient, where the start and end move and there is a lunch break. Varying the daily total: not listed for HeyReach, which has a daily limit of up to 40 invitations; automatic in Expandi, with daily limits set as ranges; automatic in Omniscient, at 80% to 100% of your limit each day. Watching the acceptance rate: by you in HeyReach, which says to keep it above 20%; not in the Expandi articles we read; automatic in Omniscient, half pace for 3 days under 20%. Slowing down when LinkedIn pushes back: automatic in HeyReach, which retries a couple of hours later; not in the Expandi articles we read; automatic in Omniscient, half pace for 3 days then back up.</desc>
