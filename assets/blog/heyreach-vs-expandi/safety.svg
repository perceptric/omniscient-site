<text x="32" y="48" font-family="Geist Mono, ui-monospace, monospace" font-size="19" fill="#737373">[Account safety]</text>
<text x="32" y="88" font-size="30" font-weight="600" fill="#0a0a0a">Who does each safety job <tspan fill="#a3a3a3">by default</tspan></text>
<text x="32" y="130" font-size="19" fill="#737373">Automatic: the tool does it on its own.</text>
<text x="32" y="158" font-size="19" fill="#737373">By you: you set it or check it yourself.</text>
<text x="32" y="186" font-size="19" fill="#737373">Not listed: not on the vendor&#x27;s pages we read.</text>
