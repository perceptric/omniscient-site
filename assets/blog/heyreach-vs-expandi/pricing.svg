<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 752" width="720" height="752" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">HeyReach and Expandi pricing compared</title>
<desc id="d">What HeyReach and Expandi cost in November 2026. HeyReach bills per LinkedIn sender: Growth $79 per sender a month, or $64 billed yearly; Agency $999 a month for 25 senders; Unlimited $2,999 a month for up to 300 senders; a free trial of 14 days with no card and up to 3 accounts. Expandi bills per seat, one LinkedIn account each: Business $99 per seat a month, or $79 billed yearly; Agency from 10 seats, priced on request; images, GIFs and video as paid extras; a free trial of 7 days with every feature.</desc>
