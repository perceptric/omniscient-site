<text x="332" y="228" font-size="21" font-weight="600" fill="#0a0a0a">HubSpot, Salesforce, Zoho CRM</text>

<rect x="32.5" y="264.5" width="280" height="132" fill="#f5f5f5" stroke="#0a0a0a"/>
