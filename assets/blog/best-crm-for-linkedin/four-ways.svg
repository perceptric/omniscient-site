<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 812" width="720" height="812" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Four ways a CRM connects to LinkedIn</title>
<desc id="d">One: Sales Navigator inside the CRM, which needs LinkedIn's Sales Navigator Advanced Plus plan, used by HubSpot, Salesforce and Zoho CRM. Two: a browser extension that works on the LinkedIn page you have open, used by folk, which saves the profile, and Salesflare, which adds a CRM sidebar. Three: a connected LinkedIn account, where new LinkedIn messages land on the matching CRM person, used by Breakcold and Omniscient. Four: outreach inside the CRM, which sends the invitations and messages your team approves, used by Omniscient. Only the first is an integration LinkedIn sells. Its help pages list extensions that scrape or automate its site among the software it doesn't permit.</desc>
<rect width="720" height="812" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="811" fill="none" stroke="#0a0a0a"/>
<text x="32" y="46" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#737373">[Four ways in]</text>
<text x="32" y="86" font-size="30" font-weight="600" fill="#0a0a0a">How a CRM connects <tspan fill="#a3a3a3">to LinkedIn</tspan></text>

