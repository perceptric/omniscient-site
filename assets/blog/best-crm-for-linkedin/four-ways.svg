<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 984" width="720" height="984" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Four ways a CRM connects to LinkedIn</title>
<desc id="d">One: Sales Navigator inside the CRM, which needs LinkedIn&#39;s Sales Navigator Advanced Plus plan, used by HubSpot, Salesforce, Microsoft Dynamics 365 Sales and Zoho CRM. Two: a browser extension that works on the LinkedIn page you have open, used by folk and Nimble, which save the profile, and Salesflare, which adds a CRM sidebar. Three: a connected LinkedIn account, where new LinkedIn messages land on the matching CRM person, used by Breakcold and Omniscient. Four: outreach inside the CRM, which sends LinkedIn messages in sequences, used by Omniscient, NetHunt CRM and Kanbox. Pipedrive and Attio reach LinkedIn through marketplace apps such as Surfe and HeyReach. Only the first is an integration LinkedIn sells. Its help pages list extensions that scrape or automate its site among the software it doesn&#39;t permit.</desc>
<rect width="720" height="984" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="719" height="983" fill="none" stroke="#0a0a0a"/>
