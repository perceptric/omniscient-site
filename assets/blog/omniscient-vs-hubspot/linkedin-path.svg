<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 1092" width="560" height="1092" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How a LinkedIn invitation goes out with HubSpot and with Omniscient</title>
<desc id="d">Two paths, one after the other. HubSpot Professional with Sales Navigator: a sequence step creates a connection request task, the rep opens Sales Navigator and sends it by hand, the LinkedIn conversation is logged to the HubSpot timeline by hand, and you update the contact and the deal in HubSpot. This path needs a Sales Hub Professional or Enterprise seat and a Sales Navigator Advanced Plus account. Omniscient: Otto drafts each message and you approve the exact text, the engine sends it inside working hours at a set pace, a reply stops that person's outreach in every campaign, and the thread opens in the Inbox next to the CRM record.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0a0a0a"/></marker></defs>
<rect width="560" height="1092" fill="#ffffff"/>
<rect x="0.5" y="0.5" width="559" height="1091" fill="none" stroke="#0a0a0a"/>
<text x="24" y="46" font-family="Geist Mono, ui-monospace, monospace" font-size="18" fill="#737373">[LinkedIn]</text>
<text x="24" y="84" font-size="26" font-weight="600" fill="#0a0a0a">How an invitation <tspan fill="#a3a3a3">goes out</tspan></text>
<g font-size="19" fill="#0a0a0a">
<text x="24" y="132" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#404040">[HubSpot Professional]</text>
<rect x="24" y="148" width="512" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="44" y="181">A sequence step creates a</text>
<text x="44" y="207">connection request task</text>
<line x1="280" x2="280" y1="226" y2="246" stroke="#0a0a0a" marker-end="url(#a)"/>
<rect x="24" y="252" width="512" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="44" y="285">The rep opens Sales Navigator</text>
<text x="44" y="311">and sends it by hand</text>
<line x1="280" x2="280" y1="330" y2="350" stroke="#0a0a0a" marker-end="url(#a)"/>
<rect x="24" y="356" width="512" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="44" y="389">The LinkedIn conversation is</text>
<text x="44" y="415">logged to the timeline by hand</text>
<line x1="280" x2="280" y1="434" y2="454" stroke="#0a0a0a" marker-end="url(#a)"/>
<rect x="24" y="460" width="512" height="78" fill="#f5f5f5" stroke="#0a0a0a"/>
<text x="44" y="493">You update the contact and</text>
<text x="44" y="519">the deal in HubSpot</text>
<rect x="24" y="581" width="14" height="14" fill="#10b981" stroke="#0a0a0a"/>
<text x="46" y="594" font-family="Geist Mono, ui-monospace, monospace" font-size="17" fill="#404040">[Omniscient]</text>
<rect x="24" y="610" width="512" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<text x="44" y="643">Otto drafts each message, and</text>
<text x="44" y="669">you approve the exact text</text>
<line x1="280" x2="280" y1="688" y2="708" stroke="#0a0a0a" marker-end="url(#a)"/>
<rect x="24" y="714" width="512" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<text x="44" y="747">The engine sends it inside</text>
<text x="44" y="773">working hours, at a set pace</text>
<line x1="280" x2="280" y1="792" y2="812" stroke="#0a0a0a" marker-end="url(#a)"/>
<rect x="24" y="818" width="512" height="78" fill="#ffffff" stroke="#0a0a0a"/>
<text x="44" y="851">A reply stops that person's</text>
<text x="44" y="877">outreach in every campaign</text>
<line x1="280" x2="280" y1="896" y2="916" stroke="#0a0a0a" marker-end="url(#a)"/>
<rect x="24" y="922" width="512" height="78" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
<text x="44" y="955">The thread opens in the Inbox,</text>
<text x="44" y="981">next to the CRM record</text>
</g>
<text x="24" y="1046" font-size="16" fill="#737373">The HubSpot path needs a Sales Hub Professional or</text>
<text x="24" y="1068" font-size="16" fill="#737373">Enterprise seat and Sales Navigator Advanced Plus.</text>
