<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 800" width="560" height="800" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">How a deal moves from call to signed contract in Omniscient</title>
<desc id="d">Six steps, one after the other. Call notes from Meet, Zoom and Teams transcripts fill the deal. The Deal Room builds the proposal from the deal, your calls and your Library. The buyer approves it on the page and the deal moves to Won. The contract is drafted from the deal, the proposal and your template. Discounts and changed terms go to an approver under your rules. Each signer signs from their own link, and key dates and the renewal land on the record.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#333333"/></marker></defs>
<rect width="560" height="800" fill="#ffffff"/>
<text x="24" y="48" font-size="19" fill="#737373">Deal Room and contracts</text>
<text x="24" y="88" font-size="26" font-weight="500" fill="#171717">From call to signed contract</text>
<g font-size="18" fill="#171717">
<rect x="24" y="124" width="512" height="76" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<rect x="42" y="148" width="28" height="28" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="56" y="168" text-anchor="middle" font-size="15">1</text>
<text x="86" y="157" font-weight="500">Call notes fill the deal</text>
<text x="86" y="182" font-size="16" fill="#404040">From Meet, Zoom and Teams transcripts</text>
<line x1="56" x2="56" y1="200" y2="222" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="24" y="228" width="512" height="76" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<rect x="42" y="252" width="28" height="28" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="56" y="272" text-anchor="middle" font-size="15">2</text>
<text x="86" y="261" font-weight="500">The Deal Room builds the proposal</text>
<text x="86" y="286" font-size="16" fill="#404040">From the deal, your calls and your Library</text>
<line x1="56" x2="56" y1="304" y2="326" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="24" y="332" width="512" height="76" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<rect x="42" y="356" width="28" height="28" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="56" y="376" text-anchor="middle" font-size="15">3</text>
<text x="86" y="365" font-weight="500">The buyer approves on the page</text>
<text x="86" y="390" font-size="16" fill="#404040">The deal moves to Won</text>
<line x1="56" x2="56" y1="408" y2="430" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="24" y="436" width="512" height="76" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<rect x="42" y="460" width="28" height="28" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="56" y="480" text-anchor="middle" font-size="15">4</text>
<text x="86" y="469" font-weight="500">The contract is drafted</text>
<text x="86" y="494" font-size="16" fill="#404040">From the deal, the proposal and your template</text>
<line x1="56" x2="56" y1="512" y2="534" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="24" y="540" width="512" height="76" fill="#ffffff" stroke="#ebebeb" rx="10"/>
<rect x="42" y="564" width="28" height="28" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="56" y="584" text-anchor="middle" font-size="15">5</text>
<text x="86" y="573" font-weight="500">Discounts go to an approver</text>
<text x="86" y="598" font-size="16" fill="#404040">Changed terms too, by your rules</text>
<line x1="56" x2="56" y1="616" y2="638" stroke="#8a8a85" marker-end="url(#a)"/>
<rect x="24" y="644" width="512" height="76" fill="#ffffff" stroke="#0c8c5e" stroke-width="2" rx="10"/>
<rect x="42" y="668" width="28" height="28" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="56" y="688" text-anchor="middle" font-size="15">6</text>
<text x="86" y="677" font-weight="500">Each signer signs from a link</text>
<text x="86" y="702" font-size="16" fill="#404040">Key dates and the renewal land on the record</text>
</g>
<text x="24" y="768" font-size="16" fill="#737373">From the Omniscient app, November 3, 2026.</text>
</svg>
