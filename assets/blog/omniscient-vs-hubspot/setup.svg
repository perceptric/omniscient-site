<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 922" width="560" height="922" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What HubSpot and Omniscient need before the forecast works</title>
<desc id="d">What each tool needs before the forecast works. HubSpot Professional: a Sales Hub Professional or Enterprise seat, a yearly commitment even when you pay monthly, the required onboarding at $1,500 paid once, and your pipelines set up or imported; then sequences and the forecast are on. Omniscient Pro: a Pro seat with no onboarding fee, Gmail or Outlook and your calendar connected, your HubSpot data imported read only, and pipelines that keep their stages from HubSpot; then the forecast reads from your deals. From HubSpot&#x27;s pricing page and knowledge base and the Omniscient app, November 3, 2026.</desc>
