<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 956" width="560" height="956" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">What HubSpot and Omniscient need before the first LinkedIn invitation</title>
<desc id="d">What each tool needs before the first LinkedIn invitation goes out. HubSpot Professional: a Sales Hub Professional or Enterprise seat, the required onboarding at $1,500 paid once, a LinkedIn Sales Navigator Advanced Plus account, the Sales Navigator integration connected, and a sequence with a connection request task; then each rep sends the requests by hand from Sales Navigator. Omniscient: a LinkedIn account connected as a sender, a list of people from Scout, messages your team has approved, and going live, which turns sending on; then a new sender starts at 5 invitations a day and adds 2 a day. From HubSpot's pricing page and knowledge base and the Omniscient app, November 3, 2026.</desc>
