<text x="82" y="251" font-size="18" fill="#171717">A yearly commitment, even paid monthly</text>
<line x1="25" x2="535" y1="274" y2="274" stroke="#ebebeb"/>
<rect x="40" y="290" width="28" height="28" fill="#ffffff" stroke="#a3a3a3" rx="6"/>
<text x="54" y="310" text-anchor="middle" font-size="15" fill="#171717">3</text>
<text x="82" y="311" font-size="18" fill="#171717">Required onboarding, $1,500 paid once</text>
<line x1="25" x2="535" y1="334" y2="334" stroke="#ebebeb"/>
