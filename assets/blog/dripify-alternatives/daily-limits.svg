<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 768" width="720" height="768" role="img" aria-labelledby="t d" font-family="Inter, system-ui, sans-serif">
<title id="t">Connection requests a day: Dripify's quota next to Omniscient's pace settings</title>
<desc id="d">Connection requests a day. Dripify, daily quota on Pro and Advanced: 75. Omniscient, highest setting: 40. Omniscient, Fast pace: 25. Omniscient, Normal pace (the default): 15. Omniscient, Careful pace: 10. Omniscient, first day of a warmup: 5. LinkedIn does not publish its own limit.</desc>
<rect width="720" height="768" fill="#ffffff"/>
<text x="32" y="50" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#737373">Connection requests a day</text>
<text x="32" y="96" font-size="34" font-weight="500" fill="#171717">Dripify's quota <tspan fill="#171717">next to our pace</tspan></text>
<text x="32" y="166" font-size="24" fill="#171717">Dripify, daily quota on Pro and Advanced</text>
<rect x="32.5" y="178.5" width="576" height="28" fill="#333333" stroke="#ebebeb" rx="6"/>
<text x="620" y="201" font-size="24" font-weight="500" fill="#171717">75</text>
<text x="32" y="252" font-size="24" fill="#171717">Omniscient, highest setting</text>
<rect x="32.5" y="264.5" width="307" height="28" fill="#ebebeb" stroke="#ebebeb" rx="6"/>
<text x="351" y="287" font-size="24" font-weight="500" fill="#171717">40</text>
<text x="32" y="338" font-size="24" fill="#171717">Omniscient, Fast pace</text>
<rect x="32.5" y="350.5" width="192" height="28" fill="#ebebeb" stroke="#ebebeb" rx="6"/>
<text x="236" y="373" font-size="24" font-weight="500" fill="#171717">25</text>
<text x="32" y="424" font-size="24" fill="#171717">Omniscient, Normal pace (the default)</text>
<rect x="32.5" y="436.5" width="115" height="28" fill="#0c8c5e" stroke="#ebebeb" rx="6"/>
<text x="159" y="459" font-size="24" font-weight="500" fill="#171717">15</text>
<text x="32" y="510" font-size="24" fill="#171717">Omniscient, Careful pace</text>
<rect x="32.5" y="522.5" width="77" height="28" fill="#ebebeb" stroke="#ebebeb" rx="6"/>
<text x="121" y="545" font-size="24" font-weight="500" fill="#171717">10</text>
<text x="32" y="596" font-size="24" fill="#171717">Omniscient, first day of a warmup</text>
<rect x="32.5" y="608.5" width="38" height="28" fill="#ebebeb" stroke="#ebebeb" rx="6"/>
<text x="82" y="631" font-size="24" font-weight="500" fill="#171717">5</text>
<line x1="32" y1="662.5" x2="688" y2="662.5" stroke="#ebebeb"/>
<text x="32" y="702" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">LinkedIn doesn't publish its own limit</text>
<text x="32" y="732" font-family="Inter, system-ui, sans-serif" font-size="19" fill="#737373">Dripify help center and pricing page, Nov 2026</text>
</svg>
